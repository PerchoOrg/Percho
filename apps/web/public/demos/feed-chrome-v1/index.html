<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Percho feed chrome — demo frames</title>
<style>
@font-face { font-family: "DM Serif Display"; src: url("./DMSerifDisplay-Regular.ttf"); }
@font-face { font-family: "TabBarIcons"; src: url("./TabBarIcons.ttf"); }
:root{
  --bg:#F7F5F0; --surface:#fff; --ink:#2B2116; --ink2:#8A7358; --ink3:#B9A88F; --accent:#B45309;
  --pos:#1B7A4D; --neg:#B3402A; --glass:rgba(250,246,240,.92);
  --rl-ink:#171715; --rl-ink2:#6F6B65; --rl-ink3:#96918A; --rl-accent:#0E6B57; --rl-surface:#F1F1EC; --rl-border:rgba(23,23,21,.08);
  --serif: ui-serif, "New York", "Iowan Old Style", Georgia, serif;
  --ui: -apple-system, "SF Pro Text", "Helvetica Neue", sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#DCD7CE;font-family:var(--ui);color:var(--ink);padding:24px}
.gallery{display:flex;flex-wrap:wrap;gap:24px;align-items:flex-start;justify-content:center}
.nav{max-width:1200px;margin:0 auto 20px;font:400 14px/1.6 var(--ui);color:#2B2116}
.nav h1{font:400 26px "DM Serif Display",serif;color:#086B5B;margin-bottom:4px}
.nav a{color:#B45309;text-decoration:none;font-weight:600;margin-right:12px}
.frame{scroll-margin-top:12px}
@media (max-width:600px){body{padding:8px} .gallery{gap:16px;justify-content:flex-start} .nav{font-size:13px} .nav h1{font-size:20px}}
.frame{width:393px}
.cap{height:56px;padding:6px 2px;font:600 15px/1.25 var(--ui);color:#2B2116}
.cap small{display:block;font:400 12.5px/1.3 var(--ui);color:#6F6B65;margin-top:2px}
.phone{position:relative;width:393px;height:852px;background:var(--bg);overflow:hidden;border-radius:44px;display:flex;flex-direction:column;box-shadow:0 20px 50px rgba(0,0,0,.25)}
body.only{padding:0;background:var(--bg)} body.only .cap{display:none} body.only .phone{border-radius:0;box-shadow:none}
.status{height:59px;display:flex;align-items:flex-end;justify-content:space-between;padding:0 30px 10px 34px;font:600 15px var(--ui)}
.status .r{display:flex;gap:6px;align-items:center}
.chrome{height:44px;display:flex;align-items:center;justify-content:center;position:relative;z-index:100}
.wordmark{font:400 34px "DM Serif Display",serif;letter-spacing:-.5px;color:#086B5B;line-height:1}
.stage{flex:1;position:relative;padding:12px 16px 10px;display:flex;align-items:center;justify-content:center}
.stack{position:relative;width:361px;height:100%}
.card{z-index:1;position:absolute;left:0;width:361px;height:83%;top:8.5%;border-radius:28px;overflow:hidden;background:#2B2116;
  box-shadow:0 3px 10px rgba(32,28,22,.05),0 16px 38px rgba(32,28,22,.085)}
.card img.media{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.badge{position:absolute;top:12px;left:12px;background:rgba(255,255,255,.92);border-radius:20px;padding:7px 10px;font:700 9.5px var(--ui);letter-spacing:1px;text-transform:uppercase;color:#181B18;z-index:2}
.save{position:absolute;top:12px;right:12px;width:40px;height:40px;border-radius:20px;background:rgba(255,255,255,.75);display:flex;align-items:center;justify-content:center;z-index:2}
.scrim{position:absolute;inset:0;background:linear-gradient(to bottom,transparent 55%,rgba(0,0,0,.5) 78%,rgba(0,0,0,.92) 100%);z-index:1}
.info{position:absolute;left:30px;right:30px;bottom:30px;z-index:2;color:#fff}
.price{font:600 28px/28px var(--serif);letter-spacing:-1.1px}
.addr{font:400 12px var(--ui);color:rgba(255,255,255,.72);margin-top:6px}
.brow{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:12px}
.specs{flex:2;display:flex;align-items:center;gap:10px;font:600 12.5px/15px var(--ui);color:rgba(255,255,255,.92)}
.specs i{width:1px;height:14px;background:rgba(255,255,255,.35)}
.cta{flex:1;display:flex;justify-content:flex-end;align-items:center;gap:6px;font:500 15px var(--ui);color:rgba(255,255,255,.92)}
/* community face (approx.) */
.cscrim{position:absolute;inset:0;z-index:1;background:linear-gradient(to bottom,rgba(7,12,9,.5) 0%,rgba(7,12,9,.12) 34%,rgba(7,12,9,.10) 60%,rgba(7,12,9,.55) 100%)}
.cname{position:absolute;left:24px;right:24px;top:62px;z-index:2;color:#fff;font:500 38px/38px var(--serif);letter-spacing:-.9px}
.csub{position:absolute;left:24px;right:24px;top:108px;z-index:2;font:400 14px/20px var(--ui);color:rgba(255,255,255,.86)}
.tiles{position:absolute;left:20px;right:20px;bottom:78px;display:flex;gap:8px;z-index:2}
.tile{flex:1;background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.15);border-radius:18px;padding:12px 8px;text-align:center;color:#fff}
.tile b{display:block;font:600 12.5px var(--ui)} .tile span{display:block;font:400 10px/13px var(--ui);color:rgba(255,255,255,.72);margin-top:4px}
.ccta{position:absolute;right:24px;bottom:40px;z-index:2;display:flex;align-items:center;gap:6px;font:500 15px var(--ui);color:rgba(255,255,255,.92)}
.dash{position:absolute;left:24px;right:24px;bottom:22px;display:flex;gap:4px;z-index:2}
.dash i{flex:1;height:3px;border-radius:2px;background:rgba(255,255,255,.35)} .dash i.on{background:#fff}
/* tab bar */
.tabbar{height:96px;padding-bottom:34px;display:flex;border-top:1px solid rgba(23,23,21,.05);background:var(--bg)}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;color:#9B9B94;font:500 12.5px var(--ui)}
.tab .g{font-family:"TabBarIcons";font-size:24.9px;line-height:24.9px} .tab.on{color:#0E6B57}
.home{position:absolute;bottom:8px;left:50%;width:134px;height:5px;margin-left:-67px;border-radius:3px;background:#2B2116;opacity:.9}
/* ---- scope variants ---- */
.slackTop{pointer-events:none;position:absolute;left:0;right:0;top:0;height:8.5%;display:flex;align-items:center;justify-content:center;z-index:8}
.pill{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px 0 10px;border-radius:999px;background:#fff;border:1px solid var(--rl-border);font:500 13px var(--ui);color:var(--rl-ink);box-shadow:0 1px 2px rgba(32,28,22,.04)}
.pill .dot{color:var(--rl-accent)}
.pill .n{color:var(--rl-ink2);font-weight:400}
.textUnder{height:22px;margin-top:-6px;display:flex;align-items:center;justify-content:center;gap:4px;font:500 13px var(--ui);color:var(--rl-ink2)}
.textUnder b{color:var(--rl-ink);font-weight:600}
.crumb{display:flex;flex-direction:column;align-items:center;gap:3px}
.crumb .l1{display:flex;align-items:center;gap:6px;font:600 14px var(--ui);color:var(--rl-ink)}
.crumb .l1 .sep{color:var(--rl-ink3);font-weight:400}
.crumb .l1 .cur{color:var(--rl-accent)}
.crumb .l2{font:400 12px var(--ui);color:var(--rl-ink2)}
/* sheet */
.dim{position:absolute;inset:0;background:rgba(0,0,0,.4);z-index:200}
.sheet{position:absolute;left:0;right:0;bottom:0;background:#fff;border-radius:24px 24px 0 0;padding:8px 20px 44px;z-index:201}
.handle{width:36px;height:5px;border-radius:3px;background:#DAD5CB;margin:0 auto 14px}
.sheet h2{font:700 22px var(--serif);color:var(--ink);margin-bottom:2px}
.sheet .sub{font:400 13px/18px var(--ui);color:var(--ink2);margin-bottom:12px}
.row{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid #EADFD0}
.row:first-of-type{border-top:0}
.row img{width:46px;height:46px;border-radius:12px;object-fit:cover;background:#EFE9DE}
.row .any{width:46px;height:46px;border-radius:12px;background:#EAF2EE;display:flex;align-items:center;justify-content:center;color:var(--rl-accent)}
.row .t{flex:1} .row b{display:block;font:600 15px var(--ui);color:var(--ink)} .row span{display:block;font:400 12.5px var(--ui);color:var(--ink2);margin-top:2px}
.row .chk{width:22px;height:22px;border-radius:11px;background:var(--rl-accent);display:flex;align-items:center;justify-content:center}
.sheet .foot{margin-top:12px;font:400 12px/16px var(--ui);color:var(--ink3);text-align:center}
/* ---- drag variants ---- */
.card.drag{transform:translateX(110px) rotate(5deg);transform-origin:50% 100%}
.card.next{transform:scale(.97);opacity:.78;box-shadow:none}
.card.glowR{box-shadow:inset 0 0 0 3px rgba(27,122,77,.95),0 0 0 1px rgba(255,255,255,.6),0 0 44px rgba(27,122,77,.45),0 16px 38px rgba(32,28,22,.085)}
.lab{position:absolute;top:72px;left:20px;z-index:20;padding:8px 14px;border:2px solid var(--pos);border-radius:16px;font:600 11px var(--ui);letter-spacing:1.2px;text-transform:uppercase;color:var(--pos);text-shadow:0 1px 3px rgba(0,0,0,.5);transform:rotate(-12deg)}
.footWord{position:absolute;left:0;right:0;bottom:0;height:8.5%;display:flex;align-items:center;justify-content:center;gap:8px;font:600 15px var(--ui);color:var(--pos);z-index:5}
.footWord .disc{width:22px;height:22px;border-radius:11px;background:var(--pos);display:flex;align-items:center;justify-content:center}
/* ---- foot band ---- */
.echo{position:absolute;left:8px;right:56px;bottom:0;height:8.5%;display:flex;align-items:center;justify-content:center;font:400 13px var(--ui);color:var(--ink2);text-align:center;z-index:5}
.echo.center{right:8px}
.sound{position:absolute;right:0;bottom:0;height:8.5%;display:flex;align-items:center;z-index:5}
.sound .d{width:32px;height:32px;border-radius:16px;background:var(--glass);border:1px solid rgba(23,23,21,.08);display:flex;align-items:center;justify-content:center;color:var(--ink)}
.soundChrome{position:absolute;top:65px;right:16px;z-index:120}
.soundChrome .d{width:32px;height:32px;border-radius:16px;background:var(--glass);border:1px solid rgba(23,23,21,.08);display:flex;align-items:center;justify-content:center;color:var(--ink)}
.soundCard{position:absolute;top:62px;right:12px;width:40px;height:40px;border-radius:20px;background:rgba(255,255,255,.75);display:flex;align-items:center;justify-content:center;z-index:2;color:#181B18}
.capV{position:absolute;top:12px;right:12px;width:38px;border-radius:19px;background:rgba(255,255,255,.85);z-index:2;color:#181B18;overflow:hidden}
.capV .u{height:37px;display:flex;align-items:center;justify-content:center}
.capV .line{height:1px;background:rgba(24,27,24,.10);margin:0 8px}
.capH{position:absolute;top:12px;right:12px;height:38px;border-radius:19px;background:rgba(255,255,255,.85);z-index:2;color:#181B18;display:flex;align-items:center;overflow:hidden}
.capH .u{width:37px;height:38px;display:flex;align-items:center;justify-content:center}
.capH .line{width:1px;align-self:stretch;background:rgba(24,27,24,.10);margin:8px 0}
.fadeDisc{opacity:.35}
.pauseWrap{position:absolute;inset:0;z-index:3;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.pauseDisc{width:64px;height:64px;border-radius:32px;background:var(--glass);display:flex;align-items:center;justify-content:center}
.pauseTri{width:0;height:0;margin-left:5px;border-top:12px solid transparent;border-bottom:12px solid transparent;border-left:20px solid var(--ink)}
.pausePill{display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 14px;border-radius:17px;background:rgba(250,246,240,.92);color:var(--ink);font:600 13px var(--ui)}
.swapSave{display:flex;align-items:center;justify-content:center;width:30px;height:30px;margin-right:2px}
.note{position:absolute;left:0;right:0;bottom:0;height:8.5%;display:flex;align-items:center;justify-content:center;font:400 12.5px var(--ui);color:var(--ink3);z-index:5;text-align:center;padding:0 12px}
.capsule{position:absolute;top:12px;right:12px;height:37px;border-radius:18.5px;background:rgba(255,255,255,.85);z-index:2;color:#181B18;display:flex;align-items:center;overflow:hidden}
.capsule .u{width:37px;height:37px;display:flex;align-items:center;justify-content:center}
.capsule .line{width:1px;align-self:stretch;background:rgba(24,27,24,.16);margin:8px 0}
.commMute{position:absolute;top:52px;right:12px;width:40px;height:40px;border-radius:20px;background:rgba(255,255,255,.85);display:flex;align-items:center;justify-content:center;z-index:2;color:#181B18}
.filmLabel{position:absolute;top:12px;right:12px;z-index:2;display:inline-flex;align-items:center;gap:5px;height:28px;padding:0 10px;border-radius:14px;background:rgba(255,255,255,.92);color:#181B18;font:600 11px var(--ui)}
.filmLabel .pin{color:#0E6B57}
.crumbBuilt{display:flex;flex-direction:column;align-items:center;gap:3px;padding:0 24px 4px;min-height:40px;justify-content:center}
.crumbBuilt .l1{display:flex;align-items:center;gap:6px}
.crumbBuilt .root{font:600 14px var(--ui);color:var(--rl-ink2)}
.crumbBuilt .sep{font:400 14px var(--ui);color:var(--rl-ink3)}
.crumbBuilt .cur{font:600 14px var(--ui);color:var(--rl-accent)}
.crumbBuilt .l2{font:400 12px var(--ui);color:var(--rl-ink2)}
/* ---- you tab ---- */
.you{padding:0 20px}
.you h1{font:700 28px var(--serif);color:var(--ink);margin:6px 0 14px}
.persona{background:#2B2116;border-radius:28px;padding:18px 20px;color:#fff;margin-bottom:22px}
.persona .eb{font:600 11px var(--ui);letter-spacing:1.2px;color:rgba(255,255,255,.72)}
.persona .nm{font:700 22px var(--serif);margin-top:6px}
.persona .ds{font:400 13px/18px var(--ui);color:rgba(255,255,255,.72);margin-top:6px}
.sh{display:flex;justify-content:space-between;align-items:baseline;font:600 11px var(--ui);letter-spacing:1.2px;color:var(--accent);margin-bottom:6px}
.sh a{font:500 12.5px var(--ui);letter-spacing:0;color:var(--ink2)}
.hrow{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid #EADFD0}
.hrow:first-of-type{border-top:0}
.hrow img{width:52px;height:52px;border-radius:14px;object-fit:cover}
.hrow .t{flex:1} .hrow b{display:block;font:600 15px var(--ui);color:var(--ink)} .hrow span{display:block;font:400 12.5px var(--ui);color:var(--ink2);margin-top:2px}
.hrow .v{font:600 12.5px var(--ui);color:var(--ink2)} .hrow .v.pass{color:var(--neg)} .hrow .v.like{color:var(--pos)}
.hrow .back{font:600 13px var(--ui);color:var(--accent);padding:8px 0 8px 8px}
.ev{margin-top:22px}
.evrow{display:flex;justify-content:space-between;padding:9px 0;border-top:1px solid #EADFD0;font:400 15px var(--ui);color:var(--ink)}
.evrow:first-of-type{border-top:0}
.evrow .bar{width:110px;height:6px;border-radius:3px;background:#EFE9DE;position:relative;align-self:center}
.evrow .bar i{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:var(--ink2)}
</style>
</head>
<body>
<div id="root"></div>
<script>
const IMG = {
  l1:'https://tavmbcghxjeyaoptndvn.supabase.co/storage/v1/object/public/listing-photos/fmls-import/587946116/00.jpg', l2:'https://tavmbcghxjeyaoptndvn.supabase.co/storage/v1/object/public/listing-photos/fmls-import/584585849/00.jpg', l3:'https://tavmbcghxjeyaoptndvn.supabase.co/storage/v1/object/public/listing-photos/fmls-import/577396655/00.jpg',
  c1:'https://tavmbcghxjeyaoptndvn.supabase.co/storage/v1/object/public/community-covers/nextdoor/apremont-highcroft.jpg', c2:'https://tavmbcghxjeyaoptndvn.supabase.co/storage/v1/object/public/community-covers/nextdoor/aberdeen-2.jpg', c3:'https://tavmbcghxjeyaoptndvn.supabase.co/storage/v1/object/public/community-covers/nextdoor/ashley-crossing.jpg', c4:'https://tavmbcghxjeyaoptndvn.supabase.co/storage/v1/object/public/community-covers/nextdoor/bellmoore-park.jpg',
  atl:'https://tavmbcghxjeyaoptndvn.supabase.co/storage/v1/object/public/community-covers/nextdoor/1660-peachtree.jpg', alp:'https://tavmbcghxjeyaoptndvn.supabase.co/storage/v1/object/public/community-covers/nextdoor/321-vaughan-dr.jpg', dul:'https://tavmbcghxjeyaoptndvn.supabase.co/storage/v1/object/public/community-covers/nextdoor/abbotts-bridge-place.jpg', ptc:'https://tavmbcghxjeyaoptndvn.supabase.co/storage/v1/object/public/community-covers/nextdoor/amberfield.jpg', jc:'https://tavmbcghxjeyaoptndvn.supabase.co/storage/v1/object/public/community-covers/nextdoor/abbotts-mill.jpg', ss:'https://tavmbcghxjeyaoptndvn.supabase.co/storage/v1/object/public/community-covers/nextdoor/alalez-park.jpg',
};
const svg = {
  bookmark:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#181B18" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>',
  arrow:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg>',
  pin:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0z"/><circle cx="12" cy="10" r="3"/></svg>',
  chev:'<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>',
  check:'<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>',
  globe:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15 15 0 0 1 0 20M12 2a15 15 0 0 0 0 20"/></svg>',
  volDark:'<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#181B18" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5L6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/></svg>',
  bookmarkW:'<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,.92)" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>',
  vol:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5L6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/></svg>',
  mute:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5L6 9H2v6h4l5 4V5z"/><path d="M22 9l-6 6M16 9l6 6"/></svg>',
};
const tabIcons = {feed:'',search:'',saved:'',you:''};

function statusBar(){return `<div class="status"><span>9:41</span><span class="r">●●●● ᯤ ▮</span></div>`;}
function tabbar(active='feed'){
  return `<div class="tabbar">${['feed','search','saved','you'].map(k=>`<div class="tab ${k===active?'on':''}"><span class="g">${tabIcons[k]}</span>${k[0].toUpperCase()+k.slice(1)}</div>`).join('')}</div><div class="home"></div>`;
}
function listingCard(img, o={}){
  const cls = ['card', o.cls||''].join(' ');
  return `<div class="${cls}">
    <img class="media" src="${img}">
    <div class="badge">Listing</div>
    ${(o.chrome==='swap'||o.chrome==='capV'||o.chrome==='capH')?'':`<div class="save">${svg.bookmark}</div>`}
    ${o.sound==='card'?`<div class="soundCard">${svg.vol}</div>`:''}
    ${o.chrome==='capV'?`<div class="capV"><div class="u">${svg.volDark}</div><div class="line"></div><div class="u">${svg.bookmark}</div></div>`:''}
    ${o.chrome==='capH'?`<div class="capH"><div class="u">${svg.volDark}</div><div class="line"></div><div class="u">${svg.bookmark}</div></div>`:''}
    ${o.chrome==='fade'?`<div class="soundCard fadeDisc">${svg.volDark}</div>`:''}
    ${o.chrome==='swap'?`<div class="save">${svg.volDark}</div>`:''}
    ${o.chrome==='built'?`<div class="capsule"><div class="u">${svg.volDark}</div><div class="line"></div><div class="u">${svg.bookmark}</div></div>`:''}
    <div class="scrim"></div>
    ${o.label?`<div class="lab">Like</div>`:''}
    ${o.chrome==='pause'?`<div class="pauseWrap"><div class="pauseDisc"><div class="pauseTri"></div></div><div class="pausePill">${svg.volDark} Sound on</div></div>`:''}
    <div class="info">
      <div class="price">${o.price||'$247,000'}</div>
      <div class="addr">${o.addr||'4123 Islington Way · Duluth, GA 30096'}</div>
      <div class="brow">
        <div class="specs"><span>${o.bd||'2 bd'}</span><i></i><span>${o.ba||'3 ba'}</span><i></i><span>${o.sq||'1,280 sqft'}</span></div>
        <div class="cta">${o.chrome==='swap'?`<span class="swapSave">${svg.bookmarkW}</span>`:''}Explore ${svg.arrow}</div>
      </div>
    </div>
  </div>`;
}
function communityCard(img, o={}){
  return `<div class="card ${o.cls||''}">
    <img class="media" src="${img}">
    <div class="badge">Community</div>
    ${o.built?`<div class="filmLabel"><span class="pin">${svg.pin}</span>Ashley Crossing · 2.4 mi</div><div class="commMute">${svg.volDark}</div>`:`<div class="save">${svg.bookmark}</div>`}
    <div class="cscrim"></div>
    <div class="cname">Ashley Crossing</div>
    <div class="csub">Alpharetta, GA · 34 restaurants nearby · Highly walkable</div>
    <div class="tiles">
      <div class="tile"><b>Restaurants</b><span>34 restaurants</span></div>
      <div class="tile"><b>Walkability</b><span>#4 resident interest</span></div>
      <div class="tile"><b>Trees</b><span>#3 resident interest</span></div>
    </div>
    <div class="ccta">Why people love it ${svg.arrow}</div>
    <div class="dash"><i class="on"></i><i class="on"></i><i></i><i></i><i></i></div>
  </div>`;
}
function scopeChrome(kind){
  if(kind==='built') return `<div class="crumbBuilt"><div class="l1"><span class="root">Atlanta metro</span><span class="sep">\u203a</span><span class="cur">Peachtree Corners</span><span style="color:var(--rl-ink3)">${svg.chev}</span></div><div class="l2">40 communities \u00b7 median $594K</div></div>`;
  if(kind==='textUnder') return `<div class="textUnder">Exploring <b>Peachtree Corners, GA</b> ${svg.chev}</div>`;
  return '';
}
function scopeSlack(kind){
  if(kind==='pill') return `<div class="slackTop"><div class="pill"><span class="dot">${svg.pin}</span>Peachtree Corners <span class="n">· 40 communities</span> <span style="color:var(--rl-ink3)">${svg.chev}</span></div></div>`;
  if(kind==='built') return '';
  if(kind==='crumb') return `<div class="slackTop"><div class="crumb"><div class="l1"><span>Atlanta</span><span class="sep">›</span><span class="cur">Peachtree Corners</span><span style="color:var(--rl-ink3)">${svg.chev}</span></div><div class="l2">40 communities · 12 with tours · median $594K</div></div></div>`;
  return '';
}
function sheet(){
  const rows = [
    ['any','Anywhere in metro Atlanta','Every community Percho has toured',false],
    [IMG.ptc,'Peachtree Corners','40 communities · 12 with tours',true],
    [IMG.jc,'Johns Creek','27 communities · median $744K',false],
    [IMG.alp,'Alpharetta','356 communities · median $594K',false],
    [IMG.dul,'Duluth','142 communities · median $430K',false],
    [IMG.ss,'Sandy Springs','24 communities · median $720K',false],
  ];
  return `<div class="dim"></div><div class="sheet"><div class="handle"></div>
    <h2>Where are you looking?</h2>
    <div class="sub">Communities here come first. Everything else still shows, further down.</div>
    ${rows.map(([img,t,s,on])=>`<div class="row">${img==='any'?`<div class="any">${svg.globe}</div>`:`<img src="${img}">`}<div class="t"><b>${t}</b><span>${s}</span></div>${on?`<div class="chk">${svg.check}</div>`:''}</div>`).join('')}
  </div>`;
}
function feed(o){
  const chromeExtra = scopeChrome(o.scope);
  const slack = scopeSlack(o.scope);
  let cards = '';
  if(o.drag){
    cards += listingCard(IMG.l2,{cls:'next',price:'$319,900',addr:'2214 Landing Walk Dr · Duluth, GA 30096',bd:'4 bd',ba:'4 ba',sq:'1,860 sqft'});
    cards += listingCard(IMG.l1,{cls:'drag'+(o.drag==='glow'?' glowR':''),label:o.drag==='badge'});
  } else if(o.card==='community'){
    cards += communityCard(IMG.c3,{built:o.scope==='built'});
  } else {
    cards += listingCard(IMG.l1,{sound:o.sound,chrome:o.chrome});
  }
  const foot = o.drag==='foot' ? `<div class="footWord"><span class="disc">${svg.check}</span>Like</div>` : '';
  const echo = o.echo ? `<div class="echo center">${o.echo}</div>` : '';
  const note = o.note ? `<div class="note">${o.note}</div>` : '';
  const sound = o.sound==='chrome' ? `<div class="soundChrome"><div class="d">${svg.vol}</div></div>` : '';
  return `<div class="phone">${statusBar()}<div class="chrome"><span class="wordmark">Percho</span></div>${chromeExtra}${sound}
    <div class="stage"><div class="stack">${slack}${cards}${foot}${echo}${note}</div></div>
    ${tabbar('feed')}${o.sheet?sheet():''}</div>`;
}
function youTab(){
  const rows = [
    [IMG.l3,'9155 Nesbit Ferry Rd','$339,000 · Johns Creek · 3 bd','pass','Passed · 2 min ago'],
    [IMG.c4,'Bellmoore Park','Johns Creek · community','like','Liked · 4 min ago'],
    [IMG.l2,'2214 Landing Walk Dr','$319,900 · Duluth · 4 bd','pass','Passed · 6 min ago'],
    [IMG.c1,'Apremont – Highcroft','Peachtree Corners · community','pass','Passed · 9 min ago'],
  ];
  return `<div class="phone">${statusBar()}<div class="you">
    <h1>You</h1>
    <div class="persona"><div class="eb">YOUR PERSONA</div><div class="nm">Trail-side settler</div><div class="ds">Move-in ready, near trails, family streets · Peachtree Corners first</div></div>
    <div class="sh"><span>RECENT</span><a>See all 38</a></div>
    ${rows.map(([img,t,s,v,vl])=>`<div class="hrow"><img src="${img}"><div class="t"><b>${t}</b><span>${s}</span><span class="v ${v}">${vl}</span></div><div class="back">Bring back</div></div>`).join('')}
    <div class="ev"><div class="sh"><span>WHAT PERCHO KNOWS</span></div>
      <div class="evrow"><span>Move-in ready</span><div class="bar"><i style="width:80%"></i></div></div>
      <div class="evrow"><span>Trails nearby</span><div class="bar"><i style="width:55%"></i></div></div>
      <div class="evrow"><span>Family streets</span><div class="bar"><i style="width:35%"></i></div></div>
    </div>
  </div>${tabbar('you')}</div>`;
}

const FRAMES = {
  S1:{group:'scope',title:'S1 · Pill in the slack band',sub:'Card keeps its size; the pill sits in the paper above it. 40 communities = the community-first count.',html:()=>feed({scope:'pill'})},
  S2:{group:'scope',title:'S2 · Quiet text under the wordmark',sub:'No pill, no box — one 13pt line. The lightest possible chrome.',html:()=>feed({scope:'textUnder'})},
  S3:{group:'scope',title:'S3 · Community-first breadcrumb + stats ✓ CHOSEN',sub:'Metro › city, then the community numbers. Shown over a community card.',html:()=>feed({scope:'crumb',card:'community'})},
  S4:{group:'scope',title:'S4 · The scope sheet (tap on any of S1–S3)',sub:'City list from the real pool (109 cities). Soft scope: ranks, never filters.',html:()=>feed({scope:'pill',sheet:true})},
  D1:{group:'feedback',title:'D1 · Rim glow',sub:'A green rim + halo on the whole card, opacity follows the drag. (A leading-edge-only glow leaves the screen with the edge.)',html:()=>feed({scope:'crumb',drag:'glow'})},
  D2:{group:'feedback',title:'D2 · Spec §1.8 badge (LIKE / PASS) ✓ CHOSEN',sub:'The existing SwipeLabels component, un-hidden.',html:()=>feed({scope:'crumb',drag:'badge'})},
  D3:{group:'feedback',title:'D3 · Word in the foot band',sub:'The card stays clean; the verdict appears in the paper under it.',html:()=>feed({scope:'crumb',drag:'foot'})},
  F3:{group:'system',title:'F3 · Sound at the PAGE top-right',sub:'32pt glass disc in the wordmark row corner. Reverses the 2026-08-14 “both top corners stay empty” rule. Trade-off echo stays in the foot band.',html:()=>feed({scope:'crumb',echo:'Move-in ready · 6 homes moved up your feed',sound:'chrome'})},
  F4:{group:'system',title:'F4 · Sound on the CARD, under the bookmark',sub:'Same 40pt disc language as the save button — the explore hero’s placement, brought to the card. Page corners stay empty.',html:()=>feed({scope:'crumb',echo:'Move-in ready · 6 homes moved up your feed',sound:'card'})},
  G1:{group:'sound',title:'G1 · One capsule, stacked',sub:'A single 40×80 disc-capsule with a hairline between the two glyphs. One object in the corner, not two buttons.',html:()=>feed({scope:'crumb',chrome:'capV'})},
  G2:{group:'sound',title:'G2 · One capsule, side by side',sub:'Same idea, laid horizontally. Shallower, sits level with the LISTING badge.',html:()=>feed({scope:'crumb',chrome:'capH'})},
  G3:{group:'sound',title:'G3 · Sound auto-hides',sub:'Shown mid-fade. Appears for ~2s when a card becomes top or on tap, then only the bookmark stays. Nothing permanent added.',html:()=>feed({scope:'crumb',chrome:'fade',note:'the sound disc has ~1s left before it fades out'})},
  G4:{group:'sound',title:'G4 · Sound lives in the pause state',sub:'Tap the card = pause (already shipped). The mute control appears with the pause glyph — zero resident chrome on a playing card.',html:()=>feed({scope:'crumb',chrome:'pause',note:'the card at rest looks exactly like today — bookmark only'})},
  G5:{group:'sound',title:'G5 · Swap: sound top-right, bookmark to the foot',sub:'Exactly one disc in the corner. The save moves next to Explore, on the bottom row.',html:()=>feed({scope:'crumb',chrome:'swap'})},
  B1:{group:'built',title:'B1 · AS BUILT — home card',sub:'S3 crumb (no "12 with tours" \u2014 the wire has no such number), G2 capsule, D2 labels on drag. This is what is on the branch.',html:()=>feed({scope:'built',chrome:'built'})},
  B2:{group:'built',title:'B2 · AS BUILT — community card',sub:'The mute drops to 52 so it clears the place-name pill the tour video BURNS into that corner. No bookmark \u2014 you removed it on 2026-08-20.',html:()=>feed({scope:'built',card:'community'})},
  B3:{group:'built',title:'B3 · AS BUILT — You tab RECENT',sub:'Four rows, each with Bring back. No Undo toast anywhere on the feed.',html:()=>youTab()},
  Y1:{group:'system',title:'Y1 · History in the You tab (instead of Undo)',sub:'Recent verdicts with “Bring back”. No toast on the feed at all.',html:()=>youTab()},
};
function fit(){const w=Number(new URLSearchParams(location.search).get('w'))||window.innerWidth; const k=Math.min(1,(w-16)/393); document.querySelectorAll('.frame, body.only .phone').forEach(el=>{el.style.zoom=String(k);});}
window.addEventListener('resize',fit);
const q = new URLSearchParams(location.search);
const only = q.get('only'); const group = q.get('group');
const root = document.getElementById('root');
if(only){ document.body.classList.add('only'); root.innerHTML = FRAMES[only].html(); }
else {
  const keys = Object.keys(FRAMES).filter(k=>!group||FRAMES[k].group===group);
  const nav = `<div class="nav"><h1>Percho feed chrome — demo frames</h1><div><b>AS BUILT: <a href="?group=built">B1–B3</a></b> &nbsp;·&nbsp; Scope: <a href="?group=scope">S1–S4</a> Drag: <a href="?group=feedback">D1–D3</a> Sound: <a href="?group=sound">G1–G5</a> System: <a href="?group=system">F3 · F4 · Y1</a> <a href="./">All</a></div><div>Jump: ${Object.keys(FRAMES).map(k=>`<a href="#${k}">${k}</a>`).join('')}</div></div>`;
  root.innerHTML = nav + `<div class="gallery">${keys.map(k=>`<div class="frame" id="${k}"><div class="cap">${FRAMES[k].title}<small>${FRAMES[k].sub}</small></div>${FRAMES[k].html()}</div>`).join('')}</div>`;
}
fit();
</script>
</body>
