<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<title>Map marker shapes — homes &amp; communities</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" />
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<style>
  /* App palette — apps/mobile/theme/tokens.ts */
  :root {
    --bg: #F7F5F0;
    --surface: #FFFFFF;
    --surface2: #F3EDE4;
    --ink: #2B2116;
    --ink2: #8A7358;
    --accent: #B45309;   /* homes */
    --pos: #1B7A4D;      /* communities */
    --glass: rgba(250, 246, 240, 0.94);
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  #map { position: absolute; inset: 0; }

  /* ── Control card ─────────────────────────────────────────────────── */
  .panel {
    position: absolute; top: 12px; left: 12px; right: 12px; z-index: 10;
    max-width: 400px; margin: 0 auto;
    background: var(--glass); border-radius: 16px; padding: 12px 14px;
    box-shadow: 0 4px 18px rgba(0,0,0,.14); backdrop-filter: blur(6px);
  }
  .panel h1 { font-size: 14px; font-weight: 700; color: var(--ink); }
  .panel .sub { font-size: 11px; color: var(--ink2); margin: 2px 0 10px; }
  .rowlabel { font-size: 10px; font-weight: 700; letter-spacing: .08em; color: var(--ink2); margin-bottom: 4px; }
  .seg { display: flex; gap: 6px; margin-bottom: 10px; flex-wrap: wrap; }
  .seg button {
    flex: 1 1 auto; border: 1px solid rgba(43,33,22,.16); background: var(--surface);
    color: var(--ink); border-radius: 999px; padding: 6px 10px; font-size: 12px;
    font-weight: 600; cursor: pointer; white-space: nowrap;
  }
  .seg button.on { background: var(--ink); color: #fff; border-color: var(--ink); }
  .seg button.onA { background: var(--accent); border-color: var(--accent); color:#fff; }
  .seg button.onP { background: var(--pos); border-color: var(--pos); color:#fff; }
  .foot { font-size: 10.5px; color: var(--ink2); }

  /* ── Shared marker bits ───────────────────────────────────────────── */
  .mk { display: flex; flex-direction: column; align-items: center; cursor: pointer; }
  .namechip, .pricechip {
    margin-top: 3px; font-size: 11px; font-weight: 600; color: var(--ink);
    background: rgba(255,255,255,.85); border-radius: 5px; padding: 1px 5px;
    max-width: 130px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .pricechip { border: 1.5px solid var(--accent); background: #fff; font-weight: 700; }
  .hidden-label .namechip { display: none; }

  /* ── HOMES ────────────────────────────────────────────────────────── */
  /* H1 · House-shaped photo. Roof + walls in one silhouette; the amber
     shell is the "border" (clip-path eats real borders), the photo is the
     same shape inset 2.5px. */
  .houseShell {
    width: 46px; height: 44px; background: var(--accent);
    clip-path: polygon(50% 0%, 100% 38%, 88% 38%, 88% 100%, 12% 100%, 12% 38%, 0% 38%);
    display: flex; align-items: flex-end; justify-content: center;
    filter: drop-shadow(0 2px 3px rgba(0,0,0,.3));
  }
  .houseShell img {
    width: 41px; height: 39.5px; object-fit: cover;
    clip-path: polygon(50% 0%, 100% 38%, 88% 38%, 88% 100%, 12% 100%, 12% 38%, 0% 38%);
  }
  /* H2 · House-glyph badge: white disc, amber house icon, pointer tip. */
  .badge {
    width: 38px; height: 38px; border-radius: 50%; background: #fff;
    border: 2px solid var(--accent); display: flex; align-items: center;
    justify-content: center; box-shadow: 0 2px 4px rgba(0,0,0,.25);
  }
  .badge svg { width: 20px; height: 20px; fill: var(--accent); }
  .tail {
    width: 0; height: 0; margin-top: -1px;
    border-left: 5px solid transparent; border-right: 5px solid transparent;
    border-top: 7px solid var(--accent);
  }
  /* H3 · today's photo circle */
  .circlePhoto {
    width: 40px; height: 40px; border-radius: 50%; border: 2px solid var(--accent);
    overflow: hidden; background: var(--surface2); box-shadow: 0 2px 4px rgba(0,0,0,.25);
  }
  .circlePhoto img { width: 100%; height: 100%; object-fit: cover; }

  /* ── COMMUNITIES ──────────────────────────────────────────────────── */
  /* C1 · today's POI dot */
  .poiDot {
    width: 20px; height: 20px; border-radius: 50%; background: #fff;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 1px 3px rgba(0,0,0,.3);
  }
  .poiDot i { width: 11px; height: 11px; border-radius: 50%; background: var(--pos); }
  /* C2 · round photo, green ring */
  .commPhoto {
    width: 30px; height: 30px; border-radius: 50%; border: 2px solid var(--pos);
    overflow: hidden; background: var(--surface2); box-shadow: 0 2px 4px rgba(0,0,0,.25);
  }
  .commPhoto img { width: 100%; height: 100%; object-fit: cover; }
  /* C3 · green circle with the initial */
  .commInitial {
    width: 26px; height: 26px; border-radius: 50%; background: var(--pos);
    border: 2px solid #fff; color: #fff; font-size: 13px; font-weight: 700;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 2px 4px rgba(0,0,0,.25);
  }
  .comm .namechip { border: none; }
</style>
</head>
<body>
<div id="map"></div>

<div class="panel">
  <h1>Map marker shapes</h1>
  <div class="sub">Pick a shape per layer — the map updates live. Amber = homes, green = communities, same as the app.</div>
  <div class="rowlabel">HOME</div>
  <div class="seg" id="segH">
    <button data-v="h1" class="onA">House · photo</button>
    <button data-v="h2">House · icon</button>
    <button data-v="h3">Circle (today)</button>
  </div>
  <div class="rowlabel">COMMUNITY</div>
  <div class="seg" id="segC">
    <button data-v="c1" class="onP">Dot (today)</button>
    <button data-v="c2">Circle · photo</button>
    <button data-v="c3">Circle · initial</button>
  </div>
  <div class="seg">
    <button id="lbl" class="on">Names shown</button>
  </div>
  <div class="foot">Preview only — positions and photos are placeholders (Alpharetta-ish). Zoom/pan freely.</div>
</div>

<script>
  const HOUSE_SVG = '<svg viewBox="0 0 24 24"><path d="M12 3l9 8h-2.6v9h-4.9v-5.6H10.5V20H5.6v-9H3z"/></svg>';

  const HOMES = [
    { lng: -84.2842, lat: 34.0731, price: '$525K', seed: 'h11' },
    { lng: -84.3009, lat: 34.0808, price: '$739K', seed: 'h12' },
    { lng: -84.2698, lat: 34.0672, price: '$1.2M', seed: 'h13' },
    { lng: -84.3121, lat: 34.0699, price: '$610K', seed: 'h14' },
    { lng: -84.2789, lat: 34.0885, price: '$868K', seed: 'h15' },
  ];
  const COMMS = [
    { lng: -84.2660, lat: 34.0890, name: 'Windward',        seed: 'c21' },
    { lng: -84.2925, lat: 34.0655, name: 'Avensong',        seed: 'c22' },
    { lng: -84.3148, lat: 34.0865, name: 'Glen Abbey',      seed: 'c23' },
    { lng: -84.2755, lat: 34.0770, name: 'Kimball Bridge',  seed: 'c24' },
    { lng: -84.3052, lat: 34.0925, name: 'Crabapple Chase', seed: 'c25' },
    { lng: -84.2580, lat: 34.0725, name: 'Waters Edge',     seed: 'c26' },
  ];
  const img = (seed, w, h) => `https://picsum.photos/seed/${seed}/${w}/${h}`;

  const map = new maplibregl.Map({
    container: 'map',
    style: 'https://basemaps.cartocdn.com/gl/positron-gl-style/style.json',
    center: [-84.287, 34.078],
    zoom: 12.6,
    attributionControl: false,
  });

  let vH = 'h1', vC = 'c1', labels = true;
  let markers = [];

  function homeEl(h) {
    const el = document.createElement('div');
    el.className = 'mk';
    if (vH === 'h1') {
      el.innerHTML = `<div class="houseShell"><img src="${img(h.seed, 92, 88)}"></div><div class="pricechip">${h.price}</div>`;
    } else if (vH === 'h2') {
      el.innerHTML = `<div class="badge">${HOUSE_SVG}</div><div class="tail"></div><div class="pricechip">${h.price}</div>`;
    } else {
      el.innerHTML = `<div class="circlePhoto"><img src="${img(h.seed, 80, 80)}"></div><div class="pricechip">${h.price}</div>`;
    }
    return el;
  }

  function commEl(c) {
    const el = document.createElement('div');
    el.className = 'mk comm' + (labels ? '' : ' hidden-label');
    const chip = `<div class="namechip">${c.name}</div>`;
    if (vC === 'c1') {
      el.innerHTML = `<div class="poiDot"><i></i></div>${chip}`;
    } else if (vC === 'c2') {
      el.innerHTML = `<div class="commPhoto"><img src="${img(c.seed, 60, 60)}"></div>${chip}`;
    } else {
      el.innerHTML = `<div class="commInitial">${c.name[0]}</div>${chip}`;
    }
    return el;
  }

  function render() {
    markers.forEach((m) => m.remove());
    markers = [];
    for (const c of COMMS) {
      markers.push(new maplibregl.Marker({ element: commEl(c), anchor: 'top' })
        .setLngLat([c.lng, c.lat]).addTo(map));
    }
    for (const h of HOMES) {
      // House shapes read as sitting ON the spot → anchor bottom of the shape
      // row (the chip hangs under, so 'center' keeps the shape near the point).
      markers.push(new maplibregl.Marker({ element: homeEl(h), anchor: 'center' })
        .setLngLat([h.lng, h.lat]).addTo(map));
    }
  }

  function wire(segId, set) {
    const seg = document.getElementById(segId);
    const cls = segId === 'segH' ? 'onA' : 'onP';
    seg.querySelectorAll('button').forEach((b) => {
      b.onclick = () => {
        seg.querySelectorAll('button').forEach((x) => x.classList.remove(cls));
        b.classList.add(cls);
        set(b.dataset.v);
        render();
      };
    });
  }
  wire('segH', (v) => { vH = v; });
  wire('segC', (v) => { vC = v; });
  document.getElementById('lbl').onclick = (e) => {
    labels = !labels;
    e.target.classList.toggle('on', labels);
    e.target.textContent = labels ? 'Names shown' : 'Names hidden';
    render();
  };

  map.on('load', render);
</script>
</body>
</html>
