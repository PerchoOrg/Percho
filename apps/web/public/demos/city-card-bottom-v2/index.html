<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Percho city card — the segmented control, four takes</title>
<style>
:root{
  --card-ink:#181B18;
  --serif: ui-serif, "New York", "Iowan Old Style", Georgia, serif;
  --ui: -apple-system, "SF Pro Text", "Helvetica Neue", sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#DCD7CE;font-family:var(--ui);color:#2B2116;padding:24px 12px 60px}
.nav{max-width:1200px;margin:0 auto 20px;font:400 14px/1.6 var(--ui)}
.nav h1{font:600 24px var(--serif);color:#086B5B;margin-bottom:4px}
.nav p{max-width:760px;color:#5A4E40;margin:6px 0}
.gallery{display:flex;flex-wrap:wrap;gap:28px 24px;align-items:flex-start;justify-content:center}
.frame{width:361px}
.cap{height:96px;padding:6px 2px 10px;font:600 16px/1.25 var(--ui);overflow:hidden}
.cap small{display:block;font:400 12.5px/1.35 var(--ui);color:#6F6B65;margin-top:3px}
.card{position:relative;width:361px;height:527px;border-radius:28px;overflow:hidden;background:#20262A;box-shadow:0 3px 10px rgba(32,28,22,.05),0 16px 38px rgba(32,28,22,.16)}
.card video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.scrim{position:absolute;inset:0;background:linear-gradient(to bottom,rgba(0,0,0,.18) 0%,transparent 16%,transparent 58%,rgba(0,0,0,.5) 80%,rgba(0,0,0,.9) 100%);z-index:1;pointer-events:none}
/* top chrome — as the app draws it */
.pill{position:absolute;top:12px;left:12px;z-index:2;display:inline-flex;align-items:center;gap:5px;background:rgba(255,255,255,.92);border-radius:14px;padding:7px 10px;font:600 10.5px var(--ui);color:var(--card-ink);max-width:250px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill svg{color:#0E6B57;flex:none}
.pill:empty,.pill.off{display:none}
.corner{position:absolute;top:12px;right:12px;z-index:2;display:flex;gap:2px;background:rgba(24,27,24,.42);border-radius:16px;padding:3px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.corner span{width:26px;height:26px;display:flex;align-items:center;justify-content:center;color:#fff}
/* bottom block */
.info{position:absolute;left:24px;right:24px;bottom:22px;z-index:2;color:#fff}
.tag{display:inline-block;background:rgba(255,255,255,.92);border-radius:6px;padding:4px 8px;font:700 9.5px var(--ui);letter-spacing:1px;color:var(--card-ink);margin-bottom:9px}
.row{display:flex;align-items:center;gap:12px}
.name{font:600 27px/30px var(--serif);flex:1;min-width:0}
.cta{flex:none;display:inline-flex;align-items:center;gap:6px;font:500 15px var(--ui);color:rgba(255,255,255,.92);background:none;border:0;cursor:pointer}
button{font-family:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}

.pillbtn{flex:none;display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 14px;border-radius:17px;border:0;background:rgba(255,255,255,.92);color:var(--card-ink);font:600 13.5px var(--ui)}
.glassbtn{flex:none;display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 14px;border-radius:17px;border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.14);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);color:#fff;font:600 13.5px var(--ui)}

/* ── C0 · as picked ── */
.C0 .control{display:grid;grid-template-columns:repeat(5,1fr);gap:2px;margin-top:14px;padding:3px;border-radius:12px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.14);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.C0 .control button{position:relative;overflow:hidden;border:0;border-radius:9px;height:28px;background:none;font:600 11px/28px var(--ui);color:rgba(255,255,255,.78);padding:0}
.C0 .control button.on{background:rgba(255,255,255,.94);color:var(--card-ink)}

/* shared: a capsule with a thumb that slides */
.cap2{position:relative;display:flex;justify-content:space-between;margin-top:14px;padding:4px;border-radius:999px;background:rgba(255,255,255,.17);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.cap2 button{position:relative;z-index:1;border:0;background:none;height:30px;padding:0 8px;font:600 12px/27px var(--ui);color:rgba(255,255,255,.8);transition:color .3s}
.cap2 button.on{color:var(--card-ink)}
.thumb{position:absolute;top:4px;left:4px;height:30px;width:0;border-radius:15px;background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.28);transition:left .5s cubic-bezier(.3,1.35,.5,1),width .5s cubic-bezier(.3,1.35,.5,1);overflow:hidden}
.thumb::after{content:'';position:absolute;left:10px;right:10px;bottom:4px;height:2px;border-radius:1px;background:rgba(24,27,24,.12)}
.thumb b{position:absolute;z-index:1;left:10px;bottom:4px;height:2px;border-radius:1px;width:0;background:#0E6B57}

/* ── C1 · sliding pill ── (uses .cap2 as is) */

/* ── C2 · the pill fills ── */
.C2 .fillbar{display:flex;gap:4px;margin-top:14px;padding:4px;border-radius:999px;background:rgba(255,255,255,.17);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.C2 .fillbar button{position:relative;flex:1 1 auto;border:0;border-radius:15px;height:30px;padding:0 7px;background:none;overflow:hidden;font:600 12px/30px var(--ui);color:rgba(255,255,255,.8)}
.C2 .fillbar button.on{background:rgba(255,255,255,.2);color:#fff}
.C2 .fillbar button.done{color:#fff}
.C2 .fillbar .fill{position:absolute;left:0;top:0;bottom:0;width:0;overflow:hidden;background:#fff;border-radius:15px 0 0 15px}
.C2 .fillbar .fill span{position:absolute;left:0;top:0;height:30px;text-align:center;color:var(--card-ink)}
.C2 .fillbar button:not(.on) .fill{display:none}

/* ── C3 · icons ── */
.C3 .tabs{position:relative;display:grid;grid-template-columns:repeat(5,1fr);margin-top:14px;padding:4px;border-radius:20px;background:rgba(255,255,255,.17);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.C3 .tabs button{position:relative;z-index:1;border:0;background:none;height:44px;padding:4px 0 0;display:flex;flex-direction:column;align-items:center;gap:3px;font:600 10px/12px var(--ui);color:rgba(255,255,255,.82);transition:color .3s}
.C3 .tabs button.on{color:var(--card-ink)}
.C3 .thumb{height:44px;border-radius:16px}

/* ── C4 · one row: the control and Explore ── */
.C4 .dock{display:flex;align-items:center;gap:8px;margin-top:14px}
.C4 .cap2{flex:1;margin-top:0}
.C4 .cap2 button{padding:0 6px;font-size:11px}
.C4 .go{flex:none;width:38px;height:38px;border-radius:19px;border:0;background:#fff;color:var(--card-ink);display:flex;align-items:center;justify-content:center;box-shadow:0 2px 10px rgba(0,0,0,.28)}
</style>
</head>
<body>
<div class="nav">
  <h1>City card — the segmented control, four takes</h1>
  <p>Direction C from the last round, and four ways to loosen it up. What made it stiff: five boxes of the same width, square corners, and a highlight that jumps from box to box. Everything here plays: tap a part and watch how the highlight gets there.</p>
</div>
<div class="gallery" id="gallery"></div>

<script src="/demos/city-card-bottom-v1/hls.light.min.js"></script>
<script>
const UID = '0b3b0ee8a86c09a7cd4d176f86e22f0a';
const FILM = `https://videodelivery.net/${UID}/manifest/video.m3u8`;
// ?t=0.45 freezes every card at that point of the film (for a still look).
const FROZEN = new URLSearchParams(location.search).get('t');
const POSTER = `https://videodelivery.net/${UID}/thumbnails/thumbnail.jpg?time=${FROZEN ? Math.round(Number(FROZEN) * 114) : 1}s&height=1054`;
const SECTIONS = [["Overview",0.3677],["Schools",0.5202],["Homes",0.6099],["Commute",0.6906],["Life",1]];
const PLACES = [["Lake Windward",0.0359],["",0.0807],["",0.1121],["Sanctuary Park",0.1435],["Windward Parkway",0.1794],["Main Street",0.2197],["",0.278],["North Point Mall",0.3677],["Creek View Elementary",0.3991],["Webb Bridge Middle",0.435],["Alpharetta High",0.4753],["Innovation Academy",0.5202],["",0.5516],["",0.5785],["",0.6099],["",0.6906],["Alpharetta Library",0.713],["Avalon",0.7713],["Big Creek Greenway",0.8206],["Wills Park Equestrian Center",0.843],["Town Green",0.8789],["Alpharetta City Hall",0.9148],["Ameris Bank Amphitheatre",0.9641],["Wills Park",1]];

const ARROW = '<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8h10M9 4l4 4-4 4"/></svg>';
const PIN = '<svg width="11" height="11" viewBox="0 0 16 16" fill="currentColor"><path d="M8 1a5 5 0 0 0-5 5c0 3.6 5 9 5 9s5-5.4 5-9a5 5 0 0 0-5-5zm0 7a2 2 0 1 1 0-4 2 2 0 0 1 0 4z"/></svg>';
const ICON = (d, size = 15) => `<svg width="${size}" height="${size}" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`;
const CORNER = `<div class="corner"><span>${ICON('<path d="M3 6h2l3-3v10l-3-3H3zM11 5.5a3.5 3.5 0 0 1 0 5"/>')}</span><span>${ICON('<path d="M8 10V2M5 5l3-3 3 3M3 9v4h10V9"/>')}</span><span>${ICON('<path d="M4 2h8v12l-4-3-4 3z"/>')}</span></div>`;
// Stand-ins for the app's own icon set.
const GLYPH = [
  '<circle cx="8" cy="8" r="6"/><path d="M10.6 5.4l-1.5 3.7-3.7 1.5 1.5-3.7z"/>',
  '<path d="M1.5 6L8 3l6.5 3L8 9z"/><path d="M4 7.6v3c1 1 2.4 1.5 4 1.5s3-.5 4-1.5v-3"/>',
  '<path d="M2.5 7.5L8 3l5.5 4.5V13h-11z"/><path d="M6.5 13V9.5h3V13"/>',
  '<path d="M2 10.5v-2l1.5-3.5h9L14 8.5v2zM3.5 10.5V12M12.5 10.5V12M2.5 8.2h11"/>',
  '<circle cx="8" cy="8" r="2.8"/><path d="M8 1.6v1.4M8 13v1.4M1.6 8H3M13 8h1.4M3.5 3.5l1 1M11.5 11.5l1 1M3.5 12.5l1-1M11.5 4.5l1-1"/>',
];
const TOP_CHROME = `<div class="pill"></div>${CORNER}`;
const words = () => SECTIONS.map(([n], i) => `<button data-s="${i}">${n}</button>`).join('');
const head = (cta) => `<span class="tag">CITY</span><div class="row"><div class="name">Alpharetta</div>${cta}</div>`;
const WHITE = `<button class="pillbtn">Explore ${ARROW}</button>`;
const GLASS = `<button class="glassbtn">Explore ${ARROW}</button>`;

const VARIANTS = [
  { id: 'C0', title: 'C · as picked', note: 'For reference: five equal boxes, the playing one switches to white.',
    html: `<div class="info">${head(WHITE)}<div class="control">${words()}</div></div>` },
  { id: 'C1', title: 'C1 · Sliding pill', note: 'A round capsule; each word takes the room it needs. One white pill slides to the playing part with a little spring, and a green line along its foot shows how far that part has played.',
    html: `<div class="info">${head(WHITE)}<div class="cap2"><div class="thumb"><b></b></div>${words()}</div></div>` },
  { id: 'C2', title: 'C2 · The pill fills', note: 'No jump at all: the playing part fills with white from left to right as it plays, and the word turns dark as the white passes under it. Explore is glass, so only one thing is white.',
    html: `<div class="info">${head(GLASS)}<div class="fillbar">${SECTIONS.map(([n], i) => `<button data-s="${i}">${n}<div class="fill"><span>${n}</span></div></button>`).join('')}</div></div>` },
  { id: 'C3', title: 'C3 · With icons', note: 'A small tab bar: an icon over each word, the white tile slides between them. Reads fastest, takes the most height.',
    html: `<div class="info">${head(WHITE)}<div class="tabs"><div class="thumb"><b></b></div>${SECTIONS.map(([n], i) => `<button data-s="${i}">${ICON(GLYPH[i], 17)}${n}</button>`).join('')}</div></div>` },
  { id: 'C4', title: 'C4 · One row with Explore', note: 'The sliding pill and Explore share the bottom row: the control on the left, a white round arrow on the right. The city name gets its line to itself.',
    html: `<div class="info">${head('')}<div class="dock"><div class="cap2"><div class="thumb"><b></b></div>${words()}</div><button class="go" aria-label="Explore Alpharetta">${ARROW}</button></div></div>` },
];

const gallery = document.getElementById('gallery');
for (const v of VARIANTS) {
  const frame = document.createElement('div');
  frame.className = 'frame';
  frame.innerHTML = `<div class="cap">${v.title}<small>${v.note}</small></div>
    <div class="card ${v.id}"><video muted playsinline loop preload="metadata" poster="${POSTER}"></video><div class="scrim"></div>${TOP_CHROME}${v.html}</div>`;
  gallery.appendChild(frame);
  wire(frame.querySelector('.card'));
}

function wire(card) {
  const video = card.querySelector('video');
  video.addEventListener('loadedmetadata', () => { card.dataset.ready = '1'; });
  if (FROZEN) { /* poster only */ }
  else if (video.canPlayType('application/vnd.apple.mpegurl')) video.src = FILM;
  else if (window.Hls && Hls.isSupported()) { const h = new Hls({ capLevelToPlayerSize: true }); h.loadSource(FILM); h.attachMedia(video); }

  const startOf = (i) => (i === 0 ? 0 : SECTIONS[i - 1][1]);
  const buttons = [...card.querySelectorAll('[data-s]')];
  for (const b of buttons) b.addEventListener('click', () => {
    if (!video.duration) return;
    video.currentTime = startOf(Number(b.dataset.s)) * video.duration + 0.05;
    video.play();
  });
  const pill = card.querySelector('.pill');
  const thumb = card.querySelector('.thumb');

  const paint = () => {
    const at = FROZEN ? Number(FROZEN) : video.duration ? video.currentTime / video.duration : 0;
    const cur = Math.max(0, SECTIONS.findIndex(([, e]) => at <= e));
    const local = Math.min(Math.max((at - startOf(cur)) / (SECTIONS[cur][1] - startOf(cur)), 0), 1);
    for (const b of buttons) {
      const i = Number(b.dataset.s);
      b.classList.toggle('on', i === cur);
      b.classList.toggle('done', i < cur);
      const fill = b.querySelector('.fill');
      if (fill) {
        fill.style.width = `${i === cur ? local * 100 : 0}%`;
        fill.firstChild.style.width = `${b.offsetWidth}px`;
      }
    }
    const active = buttons[cur];
    if (thumb && active) {
      if (FROZEN) thumb.style.transition = 'none';
      thumb.style.left = `${active.offsetLeft}px`;
      thumb.style.width = `${active.offsetWidth}px`;
      thumb.firstChild.style.width = `calc((100% - 20px) * ${local.toFixed(4)})`;
    }
    const place = (PLACES.find(([, e]) => at <= e) || ['', 1])[0];
    pill.innerHTML = place ? `${PIN}${place}` : '';
    pill.classList.toggle('off', !place);
    requestAnimationFrame(paint);
  };
  requestAnimationFrame(paint);

  // Only the card on screen plays.
  new IntersectionObserver(([e]) => { if (e.isIntersecting) video.play().catch(() => {}); else video.pause(); }, { threshold: 0.5 }).observe(card);
}
</script>
</body>
</html>
