<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Vibe · Your persona</title>
<link rel="stylesheet" href="_app.css" />
<style>
  .screen { background: linear-gradient(180deg, #0A0C10 0%, #14171E 100%); color: #fff; }

  .body-scroll {
    flex: 1; overflow-y: auto; padding: 60px 24px 24px;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }
  .body-scroll::-webkit-scrollbar { display: none; }

  .eyebrow { font-size: 11px; letter-spacing: 0.12em; opacity: 0.55; font-weight: 600; }
  .h1 { font-size: 26px; font-weight: 800; margin-top: 4px; line-height: 1.15; letter-spacing: -0.02em; }

  .persona-card {
    background: linear-gradient(135deg, rgba(232,90,42,0.28), rgba(232,90,42,0.04));
    border: 1px solid rgba(232,90,42,0.4);
    border-radius: 20px; padding: 22px; margin: 24px 0 24px;
    position: relative; overflow: hidden;
  }
  .persona-card .accent-mark {
    position: absolute; right: -30px; top: -30px;
    width: 140px; height: 140px; border-radius: 50%;
    background: radial-gradient(circle, rgba(232,90,42,0.35), transparent 65%);
  }
  .persona-name {
    font-size: 24px; font-weight: 800; color: var(--accent);
    line-height: 1.15; letter-spacing: -0.01em;
    position: relative;
  }
  .persona-desc {
    font-size: 13px; opacity: 0.92; line-height: 1.55;
    margin-top: 10px; position: relative;
  }

  .section-h {
    font-size: 11px; letter-spacing: 0.1em; opacity: 0.55;
    margin: 24px 0 12px; font-weight: 600;
  }

  /* Radar-ish trait bars */
  .traits { display: flex; flex-direction: column; gap: 10px; }
  .trait { display: flex; align-items: center; gap: 12px; }
  .trait .name { flex: 0 0 105px; font-size: 12px; opacity: 0.85; }
  .trait .track { flex: 1; height: 8px; background: rgba(255,255,255,0.08); border-radius: 4px; overflow: hidden; }
  .trait .fill {
    height: 100%; background: var(--accent); border-radius: 4px;
    transition: width 1s cubic-bezier(0.4, 0, 0.2, 1);
  }
  .trait .val { flex: 0 0 32px; font-size: 11px; text-align: right; opacity: 0.7; font-variant-numeric: tabular-nums; }

  .matches { display: flex; flex-direction: column; gap: 10px; }
  .match {
    display: flex; gap: 12px; padding: 10px; border-radius: 14px;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.08);
    cursor: pointer;
    transition: transform 0.15s ease, background 0.15s ease;
  }
  .match:active { transform: scale(0.99); background: rgba(255,255,255,0.08); }
  .match img { width: 66px; height: 66px; border-radius: 10px; object-fit: cover; flex-shrink: 0; }
  .match .info { flex: 1; min-width: 0; }
  .match .info b { font-size: 14px; }
  .match .info .city { font-size: 11px; opacity: 0.6; margin-top: 1px; }
  .match .info .reason { font-size: 11px; opacity: 0.85; margin-top: 4px; line-height: 1.4; }
  .match .score { align-self: center; text-align: center; padding: 0 4px; }
  .match .score b { font-size: 22px; color: var(--accent); font-weight: 800; }
  .match .score div { font-size: 9px; opacity: 0.55; letter-spacing: 0.06em; margin-top: -2px; }

  .cta-btn {
    width: 100%; padding: 15px; margin-top: 22px;
    border: none; border-radius: 14px;
    background: var(--accent); color: #fff;
    font-size: 15px; font-weight: 700; letter-spacing: 0.01em;
  }
  .subtle {
    text-align: center; font-size: 11px; opacity: 0.5;
    margin-top: 12px;
  }
</style>
</head>
<body>
  <div class="page-title">Vibe · Persona reveal</div>
  <a href="index.html" class="nav-back">← Home</a>
  <div class="phone">
    <div class="notch"></div>
    <div class="screen">
      <div class="body-scroll">
        <div class="eyebrow">BASED ON YOUR SWIPES</div>
        <div class="h1">Here's who you are.</div>

        <div class="persona-card">
          <div class="accent-mark"></div>
          <div class="persona-name" id="pName">—</div>
          <div class="persona-desc" id="pDesc">—</div>
        </div>

        <div class="section-h">YOUR VIBE PROFILE</div>
        <div class="traits" id="traits"></div>

        <div class="section-h">TOP MATCHES FOR YOU</div>
        <div class="matches" id="matches"></div>

        <button class="cta-btn" id="enterBtn">Take me to my Vibe →</button>
        <div class="subtle">You can refine anytime by swiping more.</div>
      </div>
    </div>
  </div>
  <script src="_data.js"></script>
  <script src="_theme.js"></script>
  <script>
    const state = loadState();
    if (!state || !state.persona) {
      location.href = 'index.html';
    } else {
      const p = state.persona;
      document.getElementById('pName').textContent = p.name;
      document.getElementById('pDesc').textContent = p.desc;

      const traitLabels = {
        family: 'Family-friendly', walkable: 'Walkability', quiet: 'Quiet',
        hip: 'Hip / trendy', outdoors: 'Outdoors', nightlife: 'Nightlife',
      };
      document.getElementById('traits').innerHTML = Object.entries(traitLabels).map(([k, label]) => `
        <div class="trait">
          <div class="name">${label}</div>
          <div class="track"><div class="fill" style="width: 0%"></div></div>
          <div class="val">${p.traits[k]}</div>
        </div>
      `).join('');
      // animate in
      requestAnimationFrame(() => {
        document.querySelectorAll('.trait .fill').forEach((el, i) => {
          const val = p.traits[Object.keys(traitLabels)[i]];
          el.style.width = `${val}%`;
        });
      });

      const ranked = rankedMatches(p.traits).slice(0, 4);
      document.getElementById('matches').innerHTML = ranked.map(({ s, score }) => `
        <a class="match" href="place.html?id=${s.id}">
          <img src="${s.img}" alt="" />
          <div class="info">
            <b>${s.name}</b>
            <div class="city">${s.city} · ${s.stats.median} median</div>
            <div class="reason">Because you value ${matchReasonFor(p, s)}.</div>
          </div>
          <div class="score"><b>${score}</b><div>MATCH</div></div>
        </a>
      `).join('');

      document.getElementById('enterBtn').onclick = () => location.href = 'app.html';
    }
  </script>
</body>
</html>
