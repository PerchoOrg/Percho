<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Peachtree Corners · Percho subdivision page v1</title>
<script>
  const t = localStorage.getItem('percho-subdivision:theme') || 'light';
  if (t === 'dark') document.documentElement.classList.add('dark');
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{
    --bg:#FBFAF7; --surface:#FFFFFF; --border:#E7E3DA;
    --ink:#141210; --mute:#68625A; --accent:#0E5E3A;
    --accent-ink:#083E26; --chip:#F1EEE6;
  }
  html.dark{
    --bg:#0B0E12; --surface:#141821; --border:#1E2330;
    --ink:#EAE7DF; --mute:#8E8A83; --accent:#4ED8A0;
    --accent-ink:#B2F0D6; --chip:#1A1F2A;
  }
  html,body{background:var(--bg);color:var(--ink);
    font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    -webkit-font-smoothing:antialiased;line-height:1.5}
  .display{font-family:Fraunces,Georgia,serif;letter-spacing:-.01em;line-height:1.1}
  a{color:inherit}
  img{max-width:100%;display:block}
  .wrap{max-width:520px;margin:0 auto;padding:0 0 96px;background:var(--bg);min-height:100vh}
  /* Theme toggle */
  .theme-tog{position:fixed;top:14px;right:14px;z-index:50;
    background:var(--surface);border:1px solid var(--border);color:var(--ink);
    border-radius:999px;padding:8px 14px;font-size:12px;font-weight:600;
    box-shadow:0 2px 8px rgba(0,0,0,.06);cursor:pointer}
  html.dark .theme-tog span[data-t="light"]{display:inline}
  html.dark .theme-tog span[data-t="dark"]{display:none}
  html:not(.dark) .theme-tog span[data-t="light"]{display:none}
  html:not(.dark) .theme-tog span[data-t="dark"]{display:inline}

  /* ==== HERO ==== */
  .hero{position:relative;height:78vh;min-height:520px;max-height:720px;overflow:hidden;
    background:#2a2620}
  .hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .hero .scrim{position:absolute;inset:0;
    background:linear-gradient(180deg,rgba(0,0,0,.10) 0%,rgba(0,0,0,.15) 40%,rgba(0,0,0,.75) 100%)}
  .hero .kicker{position:absolute;top:24px;left:20px;right:20px;
    color:rgba(255,255,255,.9);font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;
    display:flex;align-items:center;gap:8px}
  .hero .kicker::before{content:"";width:22px;height:1px;background:rgba(255,255,255,.7)}
  .hero .content{position:absolute;bottom:108px;left:20px;right:20px;color:#fff}
  .hero h1{font-size:44px;font-weight:700;margin-bottom:14px}
  .hero .sub{font-size:16px;font-weight:400;color:rgba(255,255,255,.92);max-width:36ch;line-height:1.45}
  .hero .badges{margin-top:18px;display:flex;flex-wrap:wrap;gap:8px}
  .hero .badge{background:rgba(255,255,255,.14);backdrop-filter:blur(8px);
    border:1px solid rgba(255,255,255,.22);color:#fff;
    padding:6px 10px;border-radius:999px;font-size:12px;font-weight:500}

  /* ==== SECTIONS ==== */
  section{padding:36px 20px}
  .eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;
    color:var(--mute);font-weight:600;margin-bottom:10px}
  h2{font-family:Fraunces,serif;font-size:28px;font-weight:600;line-height:1.15;
    color:var(--ink);margin-bottom:8px}
  .lede{color:var(--mute);font-size:15px;margin-bottom:22px;max-width:44ch}

  /* Swipe teaser — vertical Tinder mini (mirrors real Percho feed) */
  .swipe-stage{position:relative;height:560px;margin:0 -4px;
    perspective:1200px;user-select:none;touch-action:pan-y}
  .swipe-card{position:absolute;inset:0;border-radius:24px;overflow:hidden;
    background:#111;box-shadow:0 10px 40px rgba(0,0,0,.18);
    transition:transform .35s cubic-bezier(.2,.8,.2,1), opacity .3s}
  .swipe-card img{width:100%;height:100%;object-fit:cover}
  .swipe-card .scrim2{position:absolute;inset:0;
    background:linear-gradient(180deg,rgba(0,0,0,.05) 0%,rgba(0,0,0,.15) 50%,rgba(0,0,0,.8) 100%)}
  .swipe-card .info{position:absolute;left:20px;right:20px;bottom:20px;color:#fff}
  .swipe-card .info .type{display:inline-block;background:rgba(255,255,255,.16);
    backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.24);
    padding:5px 10px;border-radius:999px;font-size:10.5px;font-weight:600;
    letter-spacing:.1em;text-transform:uppercase;margin-bottom:12px}
  .swipe-card .info .h{font-size:22px;font-weight:600;font-family:Fraunces,serif;
    line-height:1.2;margin-bottom:6px}
  .swipe-card .info .m{font-size:13.5px;color:rgba(255,255,255,.88);line-height:1.5}
  /* verdict overlays */
  .swipe-card .verdict{position:absolute;top:24px;padding:8px 16px;
    border-radius:8px;font-weight:800;letter-spacing:.08em;font-size:14px;
    opacity:0;transform:rotate(-8deg);border:3px solid}
  .swipe-card .verdict.yes{left:20px;color:#2FBF71;border-color:#2FBF71}
  .swipe-card .verdict.no{right:20px;color:#F04E5F;border-color:#F04E5F;transform:rotate(8deg)}
  .swipe-controls{display:flex;justify-content:center;gap:20px;margin-top:20px}
  .swipe-btn{width:60px;height:60px;border-radius:50%;border:2px solid var(--border);
    background:var(--surface);display:flex;align-items:center;justify-content:center;
    font-size:24px;cursor:pointer;box-shadow:0 4px 12px rgba(0,0,0,.06);
    transition:transform .12s}
  .swipe-btn:active{transform:scale(.92)}
  .swipe-btn.no{color:#F04E5F}
  .swipe-btn.yes{color:#2FBF71}
  .swipe-progress{text-align:center;color:var(--mute);font-size:12px;
    margin-top:14px}
  .swipe-hint2{text-align:center;color:var(--mute);font-size:12px;
    margin-top:6px;font-style:italic}

  /* Who fits */
  .fits{display:grid;gap:12px}
  .fit{background:var(--surface);border:1px solid var(--border);
    border-radius:16px;padding:18px 18px 16px;display:flex;gap:14px;align-items:flex-start}
  .fit .ic{width:40px;height:40px;flex:0 0 auto;border-radius:12px;
    background:var(--chip);display:flex;align-items:center;justify-content:center;font-size:20px}
  .fit .txt .h{font-weight:600;font-size:15px;margin-bottom:2px;color:var(--ink)}
  .fit .txt .b{color:var(--mute);font-size:13.5px;line-height:1.5}

  /* Facts */
  .facts{background:var(--surface);border:1px solid var(--border);
    border-radius:20px;padding:6px 20px;overflow:hidden}
  .fact{display:flex;justify-content:space-between;align-items:baseline;
    padding:16px 0;border-bottom:1px solid var(--border)}
  .fact:last-child{border-bottom:0}
  .fact .k{color:var(--mute);font-size:13.5px;font-weight:500}
  .fact .v{font-weight:600;font-size:15px;color:var(--ink);text-align:right}
  .fact .v small{display:block;color:var(--mute);font-size:11.5px;font-weight:400;margin-top:2px}

  /* POI */
  .pois{display:grid;gap:14px}
  .poi{display:flex;gap:14px;align-items:center;
    background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:10px;
    text-decoration:none;color:inherit}
  .poi img{width:76px;height:76px;object-fit:cover;border-radius:12px;flex:0 0 auto;background:#eee}
  .poi .info{flex:1;min-width:0}
  .poi .name{font-weight:600;font-size:14.5px;color:var(--ink);margin-bottom:4px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .poi .meta{color:var(--mute);font-size:12.5px;display:flex;gap:6px;align-items:center}
  .poi .meta .r{color:var(--ink);font-weight:600}
  .poi .type{display:inline-block;background:var(--chip);color:var(--mute);
    padding:2px 8px;border-radius:999px;font-size:10.5px;font-weight:600;margin-top:6px;
    text-transform:uppercase;letter-spacing:.06em}

  /* Sticky CTA */
  .cta-bar{position:fixed;bottom:0;left:0;right:0;padding:12px 16px 20px;
    background:linear-gradient(180deg,rgba(251,250,247,0) 0%,var(--bg) 25%);
    z-index:40}
  html.dark .cta-bar{background:linear-gradient(180deg,rgba(11,14,18,0) 0%,var(--bg) 25%)}
  .cta{max-width:520px;margin:0 auto;display:block;text-align:center;
    background:var(--ink);color:var(--bg);text-decoration:none;
    padding:16px 20px;border-radius:16px;font-weight:600;font-size:15px;
    box-shadow:0 8px 24px rgba(0,0,0,.15)}
  html.dark .cta{background:var(--accent);color:#032018}
  .cta small{display:block;font-weight:400;font-size:12px;opacity:.75;margin-top:2px}

  /* Trust footer */
  .trust{padding:24px 20px 36px;color:var(--mute);font-size:11.5px;line-height:1.6;
    text-align:center;border-top:1px solid var(--border);margin-top:12px}
</style>
</head>
<body>
<button class="theme-tog" onclick="var d=document.documentElement.classList.toggle('dark');localStorage.setItem('percho-subdivision:theme',d?'dark':'light')">
  <span data-t="dark">Dark</span><span data-t="light">Light</span>
</button>

<div class="wrap" id="wrap"></div>

<div class="cta-bar">
  <a class="cta" href="#">
    Swipe 12 homes in Peachtree Corners
    <small>See what living here actually feels like →</small>
  </a>
</div>

<script>
  // ==== REAL DATA (Percho Supabase, pulled 2026-07-21) ====
  const SB = 'https://tavmbcghxjeyaoptndvn.supabase.co/storage/v1/object/public';

  const HERO_IMG = SB + '/listing-photos/c7435419-e5ad-4abb-9f01-83bfc753d0cd/b4745b22-e4e8-4c0d-ad1d-031bd9c1c6d6.jpg';

  const SWIPE = [
    // ask card — the funnel mechanic buyers see across the whole app
    {kind:'ask', type:'Ask · Style',
     img:'c7435419-e5ad-4abb-9f01-83bfc753d0cd/b4745b22-e4e8-4c0d-ad1d-031bd9c1c6d6.jpg',
     h:'New-build traditional brick — your style?',
     m:'Swipe right if this look feels like home. Left if not.'},
    // listing card — real home in Peachtree Corners
    {kind:'listing', type:'Listing · Peachtree Corners',
     img:'c7435419-e5ad-4abb-9f01-83bfc753d0cd/877cd86a-7ab3-4d69-b7ec-a0a462707fcf.jpg',
     h:'5122 Lower Creek St · $968k',
     m:'4 bd · 3,302 sqft · 2023 · Open plan, hardwoods, walk to Town Green'},
    // community card
    {kind:'community', type:'Community · Peachtree Corners',
     img:'poi/c97b6087-4e34-4ee6-9de8-de5c4a595633/045ca8ed.jpg',
     h:'Live near a real town green',
     m:'Concerts, farmers market, food trucks — 8 min walk from most PC homes'},
    // ask card — POI intent
    {kind:'ask', type:'Ask · Lifestyle',
     img:'poi/ce918044-f389-4490-a9c7-a549484b7773/23090c5d.jpg',
     h:'Walkable dinner spot within 5 min — must-have?',
     m:'Peachtree Corners ranks high on this. Say yes and we lean into it.'},
    // listing card — interior
    {kind:'listing', type:'Listing · Peachtree Corners',
     img:'c7435419-e5ad-4abb-9f01-83bfc753d0cd/f113fb53-e19d-4274-a1f8-275ef16c2426.jpg',
     h:'Primary bath, dual vanity',
     m:'The kind of finish 2023-build PC townhomes come with as standard'},
  ];

  const FITS = [
    {ic:'🏡', h:'Move-up ATL families', b:'2020s-build homes with real square footage — 3,000+ sqft is common, unlike ITP where you pay $1M+ for 2,000 sqft.'},
    {ic:'💻', h:'Hybrid & remote workers', b:'Town Green hub with fiber, coworking at Curiosity Lab, a 25-min reverse commute to Perimeter if you go in Tuesday & Thursday.'},
    {ic:'🚶', h:'Walkability seekers', b:'The Forum + Town Center + Town Green form a walkable core — dinner, groceries, live music on the lawn without moving your car.'},
  ];

  const FACTS = [
    {k:'Median list price',    v:'$685k',        sub:'2026 YTD, single-family'},
    {k:'Typical build era',    v:'1985 – 2024',  sub:'Older ranches + new townhome infill'},
    {k:'Bedrooms · sqft',      v:'4 bd · 3,000+',sub:'Median for detached'},
    {k:'HOA',                  v:'Varies',       sub:'$400–$1,800/yr by pocket'},
    {k:'Schools (Gwinnett)',   v:'Simpson · Pinckneyville · Norcross', sub:'ES · MS · HS · Cluster'},
    {k:'To Midtown ATL',       v:'28 min',       sub:'Off-peak · GA-400 & I-285'},
    {k:'Reverse commute',      v:'Yes',          sub:'AM traffic flows outbound toward tech corridor'},
  ];

  const POIS = [
    {id:'6d5e37e2-b0bf-48e5-91c3-fcd59abc2720', ph:'bb06a55a.jpg',
     name:'The Forum Peachtree Corners', type:'Shopping + dining hub', r:4.6, n:5045,
     line:'Open-air center — Whole Foods, dinner, movies, sidewalk cafes'},
    {id:'c97b6087-4e34-4ee6-9de8-de5c4a595633', ph:'045ca8ed.jpg',
     name:'Peachtree Corners Town Green', type:'Public park', r:4.9, n:446,
     line:'Concerts, farmers market, food trucks — walk from The Forum'},
    {id:'ce918044-f389-4490-a9c7-a549484b7773', ph:'23090c5d.jpg',
     name:'Stäge Kitchen & Bar', type:'Restaurant', r:4.6, n:888,
     line:'The date-night spot everyone in a 5-mile radius mentions'},
    {id:'5ed9fce2-9a5f-41cf-aa8c-715819436f87', ph:null,
     name:'The Flying Biscuit Cafe', type:'Breakfast / brunch', r:4.5, n:2321,
     line:'Weekend line out the door · Southern brunch anchor'},
    {id:'fe11871e-4c80-4d75-8e48-a0fced903d78', ph:null,
     name:'Sprouts Farmers Market', type:'Grocery', r:4.4, n:830,
     line:'Plus Ingles & Lidl within a mile — grocery is not a fight here'},
  ];

  // ==== RENDER ====
  const wrap = document.getElementById('wrap');
  wrap.innerHTML = `
    <div class="hero">
      <img src="${HERO_IMG}" alt="Home in Peachtree Corners at sunset"/>
      <div class="scrim"></div>
      <div class="kicker">Peachtree Corners · Gwinnett · GA</div>
      <div class="content">
        <h1 class="display">A quieter, greener version of Atlanta suburbia — with a walkable core most north-metro towns don't have.</h1>
        <div class="sub">17k people. 2020s-build homes in the pockets that matter, a real town green, and a reverse commute into the tech corridor at Curiosity Lab.</div>
        <div class="badges">
          <span class="badge">·  35 min to downtown ATL</span>
          <span class="badge">·  Walkable Town Center</span>
          <span class="badge">·  Gwinnett schools</span>
        </div>
      </div>
    </div>

    <section>
      <div class="eyebrow">Feel the product</div>
      <h2>This is the Percho feed. Try it.</h2>
      <p class="lede">Right = yes. Left = no. Every card teaches Percho what you like. Try 5 cards below — same UX you'll live in for the real search.</p>
      <div class="swipe-stage" id="stage"></div>
      <div class="swipe-controls">
        <button class="swipe-btn no" id="btnNo" aria-label="No">✕</button>
        <button class="swipe-btn yes" id="btnYes" aria-label="Yes">♥</button>
      </div>
      <div class="swipe-progress" id="prog"></div>
      <div class="swipe-hint2">Drag the card, or tap the buttons.</div>
    </section>

    <section>
      <div class="eyebrow">Who fits here</div>
      <h2>Three lives Peachtree Corners is built for.</h2>
      <p class="lede">If none of these sound like you, it's probably not your place — that's fine, we have 40+ other ATL pockets.</p>
      <div class="fits">
        ${FITS.map(f=>`
          <div class="fit">
            <div class="ic">${f.ic}</div>
            <div class="txt"><div class="h">${f.h}</div><div class="b">${f.b}</div></div>
          </div>
        `).join('')}
      </div>
    </section>

    <section>
      <div class="eyebrow">The hard numbers</div>
      <h2>Facts, not filler.</h2>
      <p class="lede">Everything below is verifiable. Where a range is honest, we give a range instead of a single number.</p>
      <div class="facts">
        ${FACTS.map(f=>`
          <div class="fact">
            <div class="k">${f.k}</div>
            <div class="v">${f.v}<small>${f.sub}</small></div>
          </div>
        `).join('')}
      </div>
    </section>

    <section>
      <div class="eyebrow">The neighborhood, in five places</div>
      <h2>What you'll actually see on a Saturday.</h2>
      <p class="lede">Real Google photos of real spots — sourced by Percho, no stock imagery. Ratings from Google.</p>
      <div class="pois">
        ${POIS.map(p=>`
          <a class="poi" href="#">
            ${p.ph ? `<img src="${SB}/listing-photos/poi/${p.id}/${p.ph}" alt="${p.name}"/>` :
                   `<div style="width:76px;height:76px;border-radius:12px;background:var(--chip);display:flex;align-items:center;justify-content:center;font-size:26px;flex:0 0 auto">📍</div>`}
            <div class="info">
              <div class="name">${p.name}</div>
              <div class="meta"><span class="r">★ ${p.r}</span><span>·</span><span>${p.n.toLocaleString()} reviews</span></div>
              <div class="meta" style="margin-top:4px;font-size:12px">${p.line}</div>
              <span class="type">${p.type}</span>
            </div>
          </a>
        `).join('')}
      </div>
    </section>

    <div class="trust">
      Percho · Peachtree Corners page · Data sourced from public MLS, Google Places, and Gwinnett County records.<br>
      Photos © their original listing owners or Google contributors.
    </div>
  `;

  // ==== Vertical-Tinder swipe deck ====
  const stage = document.getElementById('stage');
  const prog = document.getElementById('prog');
  let idx = 0, likes = 0;

  function renderDeck() {
    stage.innerHTML = '';
    // render up to 2 cards, top one interactive
    const remaining = SWIPE.slice(idx, idx+2);
    if (remaining.length === 0) {
      stage.innerHTML = `
        <div class="swipe-card" style="display:flex;align-items:center;justify-content:center;
          background:linear-gradient(135deg,#0E5E3A,#083E26);color:#fff;text-align:center;padding:32px">
          <div>
            <div style="font-family:Fraunces,serif;font-size:26px;font-weight:600;margin-bottom:8px">
              Got it — ${likes}/${SWIPE.length} yes.
            </div>
            <div style="opacity:.85;font-size:14px;line-height:1.5">
              In the real feed this keeps going. Every swipe narrows what Percho shows next.
            </div>
          </div>
        </div>`;
      prog.textContent = 'Try the real feed →';
      return;
    }
    remaining.reverse().forEach((s, i) => {
      const isTop = i === remaining.length - 1;
      const scale = isTop ? 1 : 0.94;
      const offset = isTop ? 0 : 12;
      const el = document.createElement('div');
      el.className = 'swipe-card';
      el.style.transform = `translateY(${offset}px) scale(${scale})`;
      el.style.zIndex = isTop ? 2 : 1;
      el.innerHTML = `
        <img src="${SB}/listing-photos/${s.img}" alt=""/>
        <div class="scrim2"></div>
        <div class="verdict yes">YES</div>
        <div class="verdict no">NOPE</div>
        <div class="info">
          <div class="type">${s.type}</div>
          <div class="h">${s.h}</div>
          <div class="m">${s.m}</div>
        </div>`;
      if (isTop) attachDrag(el);
      stage.appendChild(el);
    });
    prog.textContent = `Card ${idx+1} of ${SWIPE.length}`;
  }

  function attachDrag(card) {
    let sx=0, sy=0, dx=0, dy=0, dragging=false;
    const yes = card.querySelector('.verdict.yes');
    const no = card.querySelector('.verdict.no');

    function down(e) {
      dragging = true;
      const p = e.touches ? e.touches[0] : e;
      sx = p.clientX; sy = p.clientY;
      card.style.transition = 'none';
    }
    function move(e) {
      if (!dragging) return;
      const p = e.touches ? e.touches[0] : e;
      dx = p.clientX - sx; dy = p.clientY - sy;
      const rot = dx / 20;
      card.style.transform = `translate(${dx}px, ${dy}px) rotate(${rot}deg)`;
      yes.style.opacity = Math.max(0, Math.min(1, dx / 100));
      no.style.opacity = Math.max(0, Math.min(1, -dx / 100));
    }
    function up() {
      if (!dragging) return;
      dragging = false;
      card.style.transition = 'transform .35s cubic-bezier(.2,.8,.2,1), opacity .3s';
      if (Math.abs(dx) > 90) {
        fly(dx > 0 ? 1 : -1);
      } else {
        card.style.transform = '';
        yes.style.opacity = 0; no.style.opacity = 0;
      }
      dx = dy = 0;
    }
    function fly(dir) {
      card.style.transform = `translate(${dir*600}px, 60px) rotate(${dir*30}deg)`;
      card.style.opacity = 0;
      if (dir > 0) likes++;
      setTimeout(() => { idx++; renderDeck(); }, 320);
    }
    card._fly = fly;

    card.addEventListener('mousedown', down);
    card.addEventListener('mousemove', move);
    window.addEventListener('mouseup', up);
    card.addEventListener('touchstart', down, {passive:true});
    card.addEventListener('touchmove', move, {passive:true});
    card.addEventListener('touchend', up);
  }

  document.getElementById('btnYes').addEventListener('click', () => {
    const top = stage.querySelector('.swipe-card:last-child');
    if (top && top._fly) top._fly(1);
  });
  document.getElementById('btnNo').addEventListener('click', () => {
    const top = stage.querySelector('.swipe-card:last-child');
    if (top && top._fly) top._fly(-1);
  });

  renderDeck();
</script>
</body>
</html>
