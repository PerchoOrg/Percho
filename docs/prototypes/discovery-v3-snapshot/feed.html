<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
<title>Percho · Discovery Feed v3</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  :root {
    --bg: #0b0b10;
    --panel: #16161d;
    --ink: #f4f4f4;
    --muted: #a4a4b0;
    --accent: #ffb74d;
    --yes: #34d399;
    --no:  #f87171;
    --save:#60a5fa;
    --explore:#c084fc;
  }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif;
    overscroll-behavior: none; overflow: hidden; }

  /* top strip */
  .strip {
    position: fixed; top: 0; left: 0; right: 0; height: 48px; z-index: 50;
    background: linear-gradient(180deg, rgba(11,11,16,0.95), rgba(11,11,16,0.6));
    display: flex; align-items: center; padding: 0 12px; gap: 6px;
    overflow-x: auto; overflow-y: hidden; white-space: nowrap;
  }
  .strip::-webkit-scrollbar { display: none; }
  .chip {
    display: inline-flex; align-items: center; gap: 6px;
    background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.1);
    padding: 5px 10px; border-radius: 999px; font-size: 12px; color: var(--ink);
    flex-shrink: 0;
  }
  .chip .x { opacity: 0.5; cursor: pointer; margin-left: 2px; }
  .strip .brand { font-size: 12px; color: var(--muted); margin-right: 6px; flex-shrink: 0; }
  .strip .swipes { margin-left: auto; font-size: 11px; color: var(--muted); flex-shrink: 0; }

  /* deck */
  .deck { position: fixed; top: 48px; left: 0; right: 0; bottom: 0;
    display: flex; align-items: stretch; justify-content: center; padding: 12px; }
  .card {
    position: absolute; top: 12px; bottom: 12px; left: 12px; right: 12px;
    max-width: 460px; margin: 0 auto;
    border-radius: 24px; overflow: hidden; background: var(--panel);
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    transition: transform 0.35s cubic-bezier(0.2,0.7,0.2,1), opacity 0.35s;
    display: flex; flex-direction: column;
    touch-action: pan-y;
  }
  .card.dragging { transition: none; }
  .card.gone-r { transform: translateX(140vw) rotate(20deg); opacity: 0; }
  .card.gone-l { transform: translateX(-140vw) rotate(-20deg); opacity: 0; }
  .card.behind { transform: scale(0.94); opacity: 0.55; pointer-events: none; }

  /* card faces */
  .bg {
    position: absolute; inset: 0;
    background-size: cover; background-position: center;
  }
  .grad { position: absolute; inset: 0;
    background: linear-gradient(180deg, rgba(0,0,0,0.05) 0%, rgba(0,0,0,0.15) 40%, rgba(0,0,0,0.85) 100%); }

  .body { position: relative; z-index: 2; flex: 1; display: flex; flex-direction: column;
    justify-content: flex-end; padding: 20px 22px 24px; }

  .tag {
    align-self: flex-start;
    font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase;
    background: rgba(0,0,0,0.4); padding: 5px 10px; border-radius: 999px;
    color: var(--accent); margin-bottom: 8px;
  }
  .why {
    font-size: 13px; line-height: 1.4;
    background: rgba(255,255,255,0.08); backdrop-filter: blur(6px);
    padding: 10px 12px; border-radius: 12px; margin-bottom: 12px;
    border-left: 3px solid var(--accent);
  }
  .why b { color: var(--accent); }

  h1.q { font-size: 30px; font-weight: 700; line-height: 1.15; margin: 4px 0 6px; }
  .sub { font-size: 15px; color: rgba(255,255,255,0.85); line-height: 1.4; }

  /* hints (yes/no) */
  .hints { display: flex; justify-content: space-between; margin-top: 18px; font-size: 12px; color: rgba(255,255,255,0.75); }
  .hints .l { color: var(--no); } .hints .r { color: var(--yes); }

  /* Tradeoff split */
  .tradeoff { flex: 1; display: flex; flex-direction: column; padding: 0; position: relative; z-index: 2; }
  .tradeoff .halves { flex: 1; display: flex; }
  .tradeoff .half {
    flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center;
    padding: 24px; text-align: center;
  }
  .tradeoff .half.L { background: linear-gradient(135deg, #2c1b3d, #1a1024); }
  .tradeoff .half.R { background: linear-gradient(135deg, #1b3d31, #10241d); }
  .tradeoff .half .dim { font-size: 12px; color: var(--muted); letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 8px; }
  .tradeoff .half .lbl { font-size: 26px; font-weight: 700; line-height: 1.2; }
  .tradeoff .vs { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    background: var(--panel); border-radius: 50%; width: 44px; height: 44px;
    display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13px;
    border: 2px solid rgba(255,255,255,0.15); }
  .tradeoff .foot { padding: 14px 18px 20px; text-align: center; font-size: 12px; color: var(--muted); }

  /* Challenge */
  .challenge .body { justify-content: space-between; }
  .challenge .price-opts { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
  .challenge .price-opts button {
    flex: 1; min-width: 80px;
    background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2);
    color: var(--ink); padding: 12px 6px; border-radius: 12px; font-size: 16px; font-weight: 600;
    cursor: pointer;
  }
  .challenge .price-opts button.correct { background: var(--yes); color: #052; border-color: var(--yes); }
  .challenge .price-opts button.wrong { background: rgba(248,113,113,0.3); border-color: var(--no); }
  .challenge .reveal { margin-top: 12px; font-size: 13px; color: var(--accent); line-height: 1.4;
    background: rgba(0,0,0,0.4); padding: 10px 12px; border-radius: 10px; display: none; }
  .challenge.revealed .reveal { display: block; }

  /* Insight */
  .insight { background: linear-gradient(160deg, #3b2a5f, #1a1230); }
  .insight .body { justify-content: center; align-items: flex-start; }
  .insight .obs { font-size: 22px; font-weight: 700; line-height: 1.3; margin-bottom: 12px; }
  .insight .ev { font-size: 13px; color: var(--muted); margin-bottom: 20px; }
  .insight .hints .l { color: var(--no); } .insight .hints .r { color: var(--yes); }

  /* Listing/community actions bar */
  .actions { display: flex; gap: 8px; margin-top: 14px; }
  .actions button {
    flex: 1; padding: 10px 6px; border-radius: 12px; font-size: 13px; font-weight: 600;
    background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.15);
    color: var(--ink); cursor: pointer;
  }
  .actions .save-btn { color: var(--save); }
  .actions .explore-btn { color: var(--explore); background: rgba(192,132,252,0.15); border-color: var(--explore); }

  .meta { font-size: 13px; color: rgba(255,255,255,0.9); margin-top: 4px; }
  .meta strong { color: var(--accent); }

  /* Skip topic */
  .skip { text-align: center; margin-top: 12px; font-size: 12px; color: var(--muted); text-decoration: underline; cursor: pointer; }

  /* Empty */
  .empty { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    color: var(--muted); text-align: center; padding: 40px; }
  .empty h2 { color: var(--ink); }
  .empty button { margin-top: 16px; background: var(--accent); color: #000; padding: 10px 20px; border: none; border-radius: 999px; font-weight: 600; cursor: pointer; }

  /* debug tray */
  .debug {
    position: fixed; bottom: 8px; left: 8px; right: 8px; z-index: 100;
    font-size: 10px; color: var(--muted); background: rgba(0,0,0,0.5);
    padding: 6px 10px; border-radius: 8px; pointer-events: none;
    max-width: 460px; margin: 0 auto;
  }
</style>
</head>
<body>

<div class="strip" id="strip">
  <span class="brand">Percho</span>
  <span class="swipes" id="swipes">0 swipes</span>
</div>

<div class="deck" id="deck"></div>
<div class="debug" id="debug"></div>

<script src="_data.js"></script>
<script>
  const state = loadState();
  const feed = buildFeed();
  let pos = 0;

  const $deck = document.getElementById('deck');
  const $strip = document.getElementById('strip');
  const $swipes = document.getElementById('swipes');
  const $debug = document.getElementById('debug');

  function renderStrip() {
    // Clear all except brand + swipes
    [...$strip.querySelectorAll('.chip')].forEach(n => n.remove());
    const order = ['intent','region','state','metro','city','culture','style'];
    for (const layer of order) {
      for (const id of state.scope[layer]) {
        const chip = document.createElement('span');
        chip.className = 'chip';
        chip.textContent = chipLabel(layer, id);
        const x = document.createElement('span'); x.className = 'x'; x.textContent = '×';
        x.onclick = () => { state.scope[layer] = state.scope[layer].filter(v => v!==id); saveState(state); renderStrip(); };
        chip.appendChild(x);
        $strip.insertBefore(chip, $swipes);
      }
    }
    $swipes.textContent = state.swipes + ' swipes';
  }
  function chipLabel(layer, id) {
    // Look in ASK_POOL + EXTRA_ASKS
    for (const k of Object.keys(ASK_POOL)) if (ASK_POOL[k].scopeType===layer && ASK_POOL[k].id===id) return ASK_POOL[k].chip;
    for (const a of EXTRA_ASKS) if (a.scopeType===layer && a.id===id) return a.chip;
    return layer+':'+id;
  }

  function renderDebug() {
    const top = topDims(state, 3).map(e => `${e.dim}(${e.evidence_count})`).join(' · ');
    $debug.textContent = `profile: ${top || '(empty)'} · liked ${state.liked.length} · saved ${state.saved.length} · tradeoffs ${state.tradeoffs.length}`;
  }

  function nextCard() {
    // Skip insight positions if not eligible
    while (pos < feed.length) {
      const c = feed[pos];
      if (c.type === 'insight') {
        const ins = pickInsight(state);
        if (!ins) { pos++; continue; } // insight suppressed silently
        c._ins = ins;
      }
      return c;
    }
    return null;
  }

  function render() {
    $deck.innerHTML = '';
    renderStrip();
    renderDebug();
    const c = nextCard();
    if (!c) {
      const empty = document.createElement('div');
      empty.className = 'empty';
      empty.innerHTML = `<h2>End of feed</h2><p>You swiped ${state.swipes} times. Profile has ${state.profile.length} observations.</p><button onclick="resetAll()">Reset</button>`;
      $deck.appendChild(empty);
      return;
    }
    const el = buildCardEl(c);
    $deck.appendChild(el);
    attachSwipe(el, c);
  }

  window.resetAll = function() { clearState(); location.reload(); };

  function buildCardEl(c) {
    const card = document.createElement('div');
    card.className = 'card';
    card.dataset.type = c.type;
    if (c.type === 'preference') {
      card.innerHTML = renderPreference(c.ref);
      const skip = card.querySelector('.skip');
      if (skip) skip.onclick = (e) => { e.stopPropagation(); flick(card, 'l', c); };
    } else if (c.type === 'listing') {
      card.innerHTML = renderListing(c.ref);
      wireListingActions(card, c);
    } else if (c.type === 'community') {
      card.innerHTML = renderCommunity(c.ref);
    } else if (c.type === 'tradeoff') {
      card.classList.add('tradeoff-card');
      card.innerHTML = renderTradeoff(c.ref);
    } else if (c.type === 'challenge') {
      card.classList.add('challenge');
      card.innerHTML = renderChallenge(c.ref);
      wireChallenge(card, c);
    } else if (c.type === 'insight') {
      card.classList.add('insight');
      card.innerHTML = renderInsight(c._ins);
    }
    return card;
  }

  function renderPreference(a) {
    return `
      <div class="bg" style="background-image:url('${a.img}')"></div>
      <div class="grad"></div>
      <div class="body">
        <div class="tag">🎯 ${a.scopeType}</div>
        <h1 class="q">${a.q}</h1>
        <div class="sub">${a.sub}</div>
        <div class="hints"><span class="l">← No</span><span class="r">Yes →</span></div>
        <div class="skip">Skip this topic</div>
      </div>`;
  }

  function renderListing(l) {
    const why = whyLine(state, l);
    return `
      <div class="bg" style="background-image:url('${l.img}')"></div>
      <div class="grad"></div>
      <div class="body">
        <div class="tag">🏡 Listing · ${l.community}</div>
        <div class="why"><b>Why for you:</b> ${why}</div>
        <h1 class="q">${l.addr}</h1>
        <div class="meta"><strong>${fmtPrice(l.price)}</strong> · ${l.bd}bd · ${l.ba}ba · ${l.sqft.toLocaleString()} sqft</div>
        <div class="sub" style="margin-top:6px;">${l.hook}</div>
        <div class="actions">
          <button class="pass-btn">Pass</button>
          <button class="like-btn">Like</button>
          <button class="save-btn">Save</button>
          <button class="explore-btn">Explore →</button>
        </div>
        <div class="hints"><span class="l">← Pass</span><span class="r">Like →</span></div>
      </div>`;
  }

  function renderCommunity(comm) {
    const why = whyLine(state, comm);
    return `
      <div class="bg" style="background-image:url('${comm.img}')"></div>
      <div class="grad"></div>
      <div class="body">
        <div class="tag">🏘️ Community · Subdivision</div>
        <div class="why"><b>Why for you:</b> ${why}</div>
        <h1 class="q">${comm.name}</h1>
        <div class="sub" style="margin-top:4px;">${comm.city} — ${comm.hook}</div>
        <div class="hints"><span class="l">← Pass</span><span class="r">Like →</span></div>
      </div>`;
  }

  function renderTradeoff(t) {
    return `
      <div class="bg" style="background:linear-gradient(180deg,#111,#111);"></div>
      <div class="tradeoff">
        <div style="padding:16px 18px;">
          <div class="tag">⚖️ Trade-off · pick one</div>
          <div style="font-size:14px;color:var(--muted);margin-top:6px;">Which matters more to you?</div>
        </div>
        <div class="halves">
          <div class="half L">
            <div class="dim">${DIMS[t.L.dim].label}</div>
            <div class="lbl">${t.L.label}</div>
          </div>
          <div class="half R">
            <div class="dim">${DIMS[t.R.dim].label}</div>
            <div class="lbl">${t.R.label}</div>
          </div>
        </div>
        <div class="vs">vs</div>
        <div class="foot">← swipe for <b>${t.L.label}</b>   ·   swipe for <b>${t.R.label}</b> →</div>
      </div>`;
  }

  function renderChallenge(ch) {
    const listing = LISTINGS.find(l => l.id === ch.listingId);
    return `
      <div class="bg" style="background-image:url('${listing.img}')"></div>
      <div class="grad"></div>
      <div class="body">
        <div class="tag">🎲 Challenge · guess the price</div>
        <h1 class="q">${ch.prompt}</h1>
        <div class="sub">${listing.addr}, ${listing.community} · ${listing.bd}bd · ${listing.sqft.toLocaleString()} sqft</div>
        <div class="price-opts">
          ${ch.options.map(p => `<button data-price="${p}">${fmtPrice(p)}</button>`).join('')}
        </div>
        <div class="reveal"></div>
        <div class="hints"><span class="l">← Skip</span><span class="r">Skip →</span></div>
      </div>`;
  }

  function renderInsight(ins) {
    return `
      <div class="body">
        <div class="tag">💡 We've noticed something</div>
        <div class="obs">${ins.text}</div>
        <div class="ev">${ins.evidence}</div>
        <div class="hints"><span class="l">← Disagree</span><span class="r">Agree →</span></div>
      </div>`;
  }

  // ---- Actions ----
  function wireListingActions(card, c) {
    const l = c.ref;
    card.querySelector('.pass-btn').onclick = (e) => { e.stopPropagation(); flick(card, 'l', c); };
    card.querySelector('.like-btn').onclick = (e) => { e.stopPropagation(); flick(card, 'r', c); };
    card.querySelector('.save-btn').onclick = (e) => {
      e.stopPropagation();
      if (!state.saved.includes(l.id)) state.saved.push(l.id);
      // saving is strong signal — bump each dim
      (l.dims||[]).forEach(d => bumpDim(state, d, 1));
      saveState(state); renderDebug();
      card.querySelector('.save-btn').textContent = 'Saved ✓';
    };
    card.querySelector('.explore-btn').onclick = (e) => {
      e.stopPropagation();
      location.href = 'listing.html?id=' + encodeURIComponent(l.id);
    };
  }

  function wireChallenge(card, c) {
    const ch = c.ref;
    const btns = card.querySelectorAll('.price-opts button');
    let answered = false;
    btns.forEach(b => {
      b.onclick = (e) => {
        e.stopPropagation();
        if (answered) return; answered = true;
        const guess = Number(b.dataset.price);
        btns.forEach(x => x.disabled = true);
        b.classList.add(guess === ch.correct ? 'correct' : 'wrong');
        if (guess !== ch.correct) {
          [...btns].find(x => Number(x.dataset.price)===ch.correct).classList.add('correct');
        }
        card.classList.add('revealed');
        card.querySelector('.reveal').innerHTML =
          `Actual: <b>${fmtPrice(ch.correct)}</b>. ${ch.teach}`;
      };
    });
  }

  // ---- Swipe handling ----
  function attachSwipe(card, c) {
    let sx=0, sy=0, dx=0, dy=0, dragging=false;
    const onStart = (e) => {
      const t = e.touches ? e.touches[0] : e;
      sx = t.clientX; sy = t.clientY; dx=0; dy=0; dragging = true;
      card.classList.add('dragging');
    };
    const onMove = (e) => {
      if (!dragging) return;
      const t = e.touches ? e.touches[0] : e;
      dx = t.clientX - sx; dy = t.clientY - sy;
      // ignore vertical
      if (Math.abs(dy) > Math.abs(dx) * 1.5 && Math.abs(dy) > 30) return;
      const rot = dx * 0.05;
      card.style.transform = `translate(${dx}px, ${dy*0.3}px) rotate(${rot}deg)`;
    };
    const onEnd = () => {
      if (!dragging) return;
      dragging = false;
      card.classList.remove('dragging');
      const threshold = 90;
      if (dx > threshold)      flick(card, 'r', c);
      else if (dx < -threshold) flick(card, 'l', c);
      else card.style.transform = '';
    };
    card.addEventListener('touchstart', onStart, { passive: true });
    card.addEventListener('touchmove',  onMove,  { passive: true });
    card.addEventListener('touchend',   onEnd);
    card.addEventListener('mousedown',  onStart);
    window.addEventListener('mousemove', onMove);
    window.addEventListener('mouseup',   onEnd);
  }

  function flick(card, dir, c) {
    card.style.transform = '';
    card.classList.add(dir === 'r' ? 'gone-r' : 'gone-l');
    onSwipe(c, dir);
    setTimeout(() => { pos++; render(); }, 320);
  }

  function onSwipe(c, dir) {
    state.swipes++;
    const yes = dir === 'r';
    if (c.type === 'preference') {
      const a = c.ref;
      const layer = a.scopeType;
      if (yes) {
        if (!state.scope[layer].includes(a.id)) state.scope[layer].push(a.id);
        if (a.dimYes) bumpDim(state, a.dimYes, 1);
      } else {
        if (!state.scopeRejected[layer].includes(a.id)) state.scopeRejected[layer].push(a.id);
      }
    } else if (c.type === 'listing') {
      const l = c.ref;
      if (yes) {
        state.liked.push(l.id);
        (l.dims||[]).forEach(d => bumpDim(state, d, 1));
      } else {
        state.passed.push(l.id);
      }
    } else if (c.type === 'community') {
      const comm = c.ref;
      if (yes) {
        (comm.dims||[]).forEach(d => bumpDim(state, d, 1));
      }
    } else if (c.type === 'tradeoff') {
      const t = c.ref;
      const chosen = yes ? t.R.dim : t.L.dim;
      state.tradeoffs.push({ dim_L: t.L.dim, dim_R: t.R.dim, chosen });
      bumpDim(state, chosen, 1);
    } else if (c.type === 'insight') {
      const dim = c._ins.dim;
      if (!state.insightsFired.includes(dim)) state.insightsFired.push(dim);
      if (!yes) {
        // disagree — demote evidence
        const e = state.profile.find(x => x.dim === dim);
        if (e) e.evidence_count = Math.max(0, e.evidence_count - 2);
      }
    } else if (c.type === 'challenge') {
      // swipe on challenge is just an advance, no signal beyond count
    }
    saveState(state);
  }

  render();
</script>
</body>
</html>
